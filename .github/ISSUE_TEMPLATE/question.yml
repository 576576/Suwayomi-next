name: 讨论与求助
description: 用法、配置与部署方面的疑问
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先阅读[使用文档](https://github.com/576576/Suwayomi-next/blob/main/docs/zh/user-guide.md)。
        可复现的缺陷请使用「Bug 报告」，明确的功能需求请使用「功能请求」。

  - type: textarea
    id: question
    attributes:
      label: 问题描述
      description: 说明希望达成的目标与当前遇到的阻碍。
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: 主题
      options:
        - 安装与升级
        - 目录与数据迁移
        - 端口与网络访问
        - 认证与登录
        - OPDS 与第三方客户端
        - 扩展与图源
        - 容器部署
        - 其他
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的做法
      description: 已调整的设置，或已查阅的日志片段。
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 版本
      description: 见 WebUI「设置 → 高级 → 调试信息」中的 Version。
      placeholder: 例：r3347-alpha
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 已阅读使用文档，并检索既有 issue。
          required: true
