name: Build

# 可复用构建工作流（workflow_call）：所有 target 的编译 + 打包都在这里完成。
# 调用方 release.yml 负责算版本号、解析 WebUI 制品、创建 Release；本文件只负责把包做出来。
#
# pack_mode 对应合并前两个 workflow 各自的产物约定：
#   channel —— 手动发布：产物名带通道段 Suwayomi-{VER}-{CH}-{TGT}，再按选项追加形态
#              后缀：pack_core → `-core`（不打包 JRE），pack_jre → `+jre`（在 -core
#              的内容之上追加裁剪后的 JRE）。两者互相独立、可同时选中。
#   alpha   —— 推送自动构建：产物名 Suwayomi-{VER}-{TGT}+jre，Windows/Linux 都捆 JRE
#              （自动构建没有交互选项，固定 core=false / jre=true）。
# Android 由独立的 android job 构建，产出 APK，**不参与** -core/+jre 这组选项。
# 通道语义 / 版本规则 / 捆绑细节见 docs/release.md。

on:
  workflow_call:
    inputs:
      channel:
        description: alpha / beta / release —— 写入编译期 SUWAYOMI_BUILD_TYPE，并作为产物名的通道段
        required: true
        type: string
      pack_mode:
        description: channel = 手动发布产物约定；alpha = 自动构建产物约定
        required: true
        type: string
      version_name:
        description: 版本名（release/beta 为 3.y.z，alpha 为 r{code}）
        required: true
        type: string
      count:
        description: 提交数（versionCode = count + 3000，由 build.rs 推导）
        required: true
        type: string
      webui_url:
        description: 捆绑的 WebUI zip 下载地址（调用方解析一次，所有 target 复用同一份）
        required: true
        type: string
      targets:
        description: 桌面/服务端构建矩阵 include 数组（JSON 字符串，不含 Android；可为空数组）
        required: true
        type: string
      pack_core:
        description: 产出 -core 包（最小形态，不打包 JRE）
        required: false
        type: boolean
        default: true
      pack_jre:
        description: 产出 +jre 包（在 -core 内容之上追加 jlink 裁剪出的 JRE，见 scripts/make-jre.sh）
        required: false
        type: boolean
        default: false
      android_arm64:
        description: 是否构建 Android arm64 APK（扩展跑系统 ART，不打包 JRE）
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    # targets 可以是空数组（只勾了 Android 时）——矩阵为空会让 Actions 直接报错，
    # 所以显式跳过。
    if: inputs.targets != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}
    env:
      CARGO_TERM_COLOR: always
      SUWAYOMI_VERSION_COUNT: ${{ inputs.count }}
      # 合并前的自动构建（alpha）不传 VERSION_NAME，由 build.rs 回退到 r{versionCode}；
      # 此处两种模式统一传入，值与回退结果完全一致（调用方算出的 alpha 版本名即 r{count+3000}）。
      SUWAYOMI_VERSION_NAME: ${{ inputs.version_name }}
      SUWAYOMI_BUILD_TYPE: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装交叉编译工具链
        # 只有"在 x86_64 runner 上出 aarch64 包"才需要交叉工具链。linux-arm64 现在
        # 跑在原生 arm64 runner 上（见 release.yml 的 target mapping）——jlink 不能
        # 跨平台生成运行时，+jre 要求 runner 与目标同架构。
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu' && runner.arch == 'X64'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: 安装桌面壳系统依赖（Linux）
        # 托盘壳（Tauri）在所有 Linux target 上都要（webkit2gtk + appindicator）；
        # ubuntu-24.04-arm 的 arm64 源里有同名包，所以两个架构共用同一条命令。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: 安装 JDK
        # 两个用途：构建 bin/jvm-sandbox.jar（gradle toolchain 25），以及 +jre 时的
        # jlink（它只随 JDK 提供）。无条件安装 —— 按 target 细分条件只会让这里更难维护，
        # 而 setup-java 本身很快。
        #
        # 发行版按 matrix.jdk 走：默认 temurin；**windows-arm64 用 zulu** —— Adoptium
        # 对 windows/aarch64 没发 JDK 25 的任何制品（jdk/jre/jmods 全 404），而 Zulu 的
        # win_aarch64 归档自带 jmods/，make-jre.sh 会直接用它、跳过下载。
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.jdk }}
          java-version: '25'
      - name: 构建
        shell: bash
        run: |
          cargo build --release -p suwayomi-server --target ${{ matrix.rust_target }}
      - name: 打包
        id: pack
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          CH="${{ inputs.channel }}"
          TGT="${{ matrix.target }}"
          MODE="${{ inputs.pack_mode }}"
          BIN="target/${{ matrix.rust_target }}/release/suwayomi-server"
          # 判平台一律用 runner.os，不要拿 matrix.os 的 runner 标签去比字面量 ——
          # Windows 的 runner 标签不止 windows-latest 一个（还有 windows-11-arm），
          # 按标签比会让新架构悄悄走错分支（.exe 后缀、zip 打包都会错）。
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi

          IS_WIN="false"
          [ "${{ runner.os }}" = "Windows" ] && IS_WIN="true"

          # 产物基名（两套约定见文件头 pack_mode）；形态后缀在下面按选项追加
          if [ "$MODE" = "alpha" ]; then
            BASE="Suwayomi-${VER}-${TGT}"
          else
            BASE="Suwayomi-${VER}-${CH}-${TGT}"
          fi

          # 先把与形态无关的载荷铺到暂存目录（这就是 `-core` 的全部内容），
          # 之后按需复制成 -core / +jre 两份，避免重复下载 WebUI、重复 gradle。
          STAGE="dist/${BASE}"
          rm -rf "$STAGE" "dist/${BASE}-core" "dist/${BASE}+jre"
          mkdir -p "$STAGE/bin"
          cp "$BIN" "$STAGE/bin/"

          # 桌面壳（Tauri 托盘）：**所有**桌面 target 都出（Windows / Linux x64+arm64 /
          # macOS x64+arm64）。Android 不在此矩阵里，它由独立的 android job 出 APK。
          # 三个平台都是原生 runner 编译，tray 有自己的 workspace 与 target 目录。
          bash suwayomi-tray/build-tray.sh
          cp suwayomi-tray/target/release/suwayomi "$STAGE/" 2>/dev/null \
            || cp suwayomi-tray/target/release/suwayomi.exe "$STAGE/" 2>/dev/null \
            || echo "WARN: desktop shell binary not found"

          # 扩展沙盒 jar 进 bin/（server 自动查找）；跨平台字节码，各 target 各自构建。
          # 注意与托盘壳无关：server 跑扩展靠它，任何 target 都不能少。
          cd jvm-sandbox && ./gradlew -q jar --no-daemon && cd ..
          cp jvm-sandbox/build/libs/suwayomi-jvm-sandbox.jar "$STAGE/bin/jvm-sandbox.jar"
          # WebUI：调用方已按通道解析好，所有 target 用同一份
          curl -sL -o webui.zip "${{ inputs.webui_url }}"
          mkdir -p "$STAGE/webui"
          python3 -c "import zipfile; zipfile.ZipFile('webui.zip').extractall('$STAGE/webui')"
          rm -f webui.zip
          mkdir -p "$STAGE/data/autobackup" "$STAGE/data/downloads" "$STAGE/data/local"

          zip_dir() {
            powershell -Command "Compress-Archive -Path '$1' -DestinationPath '$2' -Force"
          }

          # 压包：Windows 出 zip，其余出 tar.gz。结果放 $ARCHIVE。
          ARCHIVE=""
          pack_dir() {
            local dir="$1"
            if [ "$IS_WIN" = "true" ]; then
              zip_dir "$dir" "${dir}.zip"
              ARCHIVE="${dir}.zip"
            else
              tar -C dist -czf "${dir}.tar.gz" "$(basename "$dir")"
              ARCHIVE="${dir}.tar.gz"
            fi
          }

          ARTIFACTS=""
          if [ "${{ inputs.pack_core }}" = "true" ]; then
            CORE="dist/${BASE}-core"
            cp -r "$STAGE" "$CORE"
            pack_dir "$CORE"
            ARTIFACTS="$ARCHIVE"
          fi
          if [ "${{ inputs.pack_jre }}" = "true" ]; then
            JRE_DIR="dist/${BASE}+jre"
            cp -r "$STAGE" "$JRE_DIR"
            # jlink 只为本平台生成镜像，所以这里 target 必须与 runner 同架构；
            # release.yml 的 mapping 保证了这一点，make-jre.sh 里再兜底校验一次。
            bash scripts/make-jre.sh "${{ matrix.jre_os }}" "${{ matrix.jre_arch }}" "$JRE_DIR/jre"
            pack_dir "$JRE_DIR"
            ARTIFACTS="${ARTIFACTS:+$ARTIFACTS$'\n'}$ARCHIVE"
          fi
          rm -rf "$STAGE"

          if [ -z "$ARTIFACTS" ]; then
            echo "::error::-core 与 +jre 都没勾选，没有任何产物可出"
            exit 1
          fi

          {
            echo "artifacts<<ARTIFACTS_EOF"
            printf '%s\n' "$ARTIFACTS"
            echo "ARTIFACTS_EOF"
            echo "artifact_name=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "packed artifacts:"
          echo "$ARTIFACTS" | sed 's/^/  /'
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}

  android:
    name: 构建 android-arm64
    if: inputs.android_arm64
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SUWAYOMI_VERSION_COUNT: ${{ inputs.count }}
      SUWAYOMI_VERSION_NAME: ${{ inputs.version_name }}
      SUWAYOMI_BUILD_TYPE: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - name: 安装 JDK
        # Gradle 9 需要 ≥ 17；与另外几处保持同一个 25，避免"本地能跑、CI 不能"。
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: 安装 Android SDK 组件
        # ubuntu runner 预装了 Android SDK（含 cmdline-tools），但 compileSdk 37 与
        # NDK 28.2 都不在预装列表里，按需补装。NDK 版本显式钉住并导出 ANDROID_NDK_HOME：
        # android/scripts/build-rust.sh 会优先用它，避免悄悄选中 runner 上的新版本。
        #
        # 平台包名是 **android-37.0**，不是 android-37 —— API 36.1 起 Google 改用
        # "次版本号"命名（36.1 / 37.0 / 37.1 / 37.2 各自是独立包，而裸 android-37
        # 不存在）。写成 android-37 会在这一步直接
        # `Warning: Failed to find package 'platforms;android-37'` 退出 1。
        # 三者都在稳定通道（channel-0），不需要 --channel。
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "ndk;28.2.13676358"
      - name: 交叉编译 Rust server（cdylib）
        # 产出 android/app/src/main/jniLibs/arm64-v8a/libsuwayomi_android.so
        run: bash android/scripts/build-rust.sh
      - name: 打包 WebUI 进 assets
        run: |
          curl -sL -o webui.zip "${{ inputs.webui_url }}"
          bash android/scripts/package-webui.sh webui.zip
      - name: 准备 release 签名（可选）
        # 没配 secret 就用 AGP 的 debug key 签名并给出警告 —— 自用分发里"能装上"
        # 比"签名好看"重要。注意临时 debug key 每次 CI 都不同：跨次覆盖安装前
        # 要先卸载。要稳定签名就配这组 secret。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/keystore.jks
            {
              echo "SUWAYOMI_KEYSTORE=keystore.jks"
              echo "SUWAYOMI_KEYSTORE_PASSWORD=$KS_PASS"
              echo "SUWAYOMI_KEY_ALIAS=${KEY_ALIAS:-suwayomi}"
              echo "SUWAYOMI_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "已注入 release keystore"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，APK 将用临时 debug key 签名（跨次安装需先卸载）"
          fi
      - name: Gradle 构建 APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: 打包产物
        id: pack
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          CH="${{ inputs.channel }}"
          MODE="${{ inputs.pack_mode }}"
          TGT="android-arm64"

          # 与桌面产物同一套命名约定（见文件头）：alpha 无通道段，手动带通道段。
          # Android 不打包 JRE，所以没有 -core/+jre 形态后缀。
          if [ "$MODE" = "alpha" ]; then
            NAME="Suwayomi-${VER}-${TGT}"
          else
            NAME="Suwayomi-${VER}-${CH}-${TGT}"
          fi

          APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "::error::找不到 $APK"; ls -R android/app/build/outputs/apk 2>/dev/null; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/${NAME}.apk"

          {
            echo "artifacts=dist/${NAME}.apk"
            echo "artifact_name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "packed: dist/${NAME}.apk ($(du -h "dist/${NAME}.apk" | cut -f1))"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}
