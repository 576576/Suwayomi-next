[package]
name = "suwayomi-core"
description = "Domain models, database schema and source API abstractions (migrated from Suwayomi kotlin manga/model + server/database)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sqlx.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
prost.workspace = true
anyhow.workspace = true
oliphaunt.workspace = true
flate2.workspace = true

[build-dependencies]
# Stages the Oliphaunt native runtime/broker artifacts into OUT_DIR and emits
# OLIPHAUNT_RESOURCES_DIR for register_build_resources!().
oliphaunt-build = "0.1.1"

# Oliphaunt runtime selection (used by oliphaunt-build in build.rs).
[package.metadata.oliphaunt]
runtime = "liboliphaunt-native"
runtime-version = "0.1.1"
extensions = []
