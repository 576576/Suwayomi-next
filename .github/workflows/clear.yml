name: Clear Release

# 预发布清理 CI（**只手动触发**）：推 main 的自动 alpha 每次提交都会多出一个
# Release，列表很快被 r{code}-alpha.{run_id} 淹没。本工作流按「每 24 小时
# （dispatch 里 window_hours 可改）的窗口内只留最新的 1 个预发布」的原则清理，
# 其余一律删掉（默认连关联 tag 一起删，可用 cleanup_tag 关掉）。
#
# - **只动 prerelease=true 的 Release**：正式版（v3.y.z）不在范围内；beta 在
#   release.yml 里是 prerelease=false，同样天然不会被选中 —— 所以这里清理的
#   实际就是 alpha。通道 / tag 规则见 docs/release.md。
# - **窗口从最新那条往回推**，不是按自然日或整点切分：保留最新的一条，它是当前
#   窗口的锚点；往回凡是距锚点不足 window_hours 的都删，遇到早于锚点一个窗口的
#   那条就保留并成为新锚点，如此往旧推进。绝对时刻切分会把"同一天里推了 5 次"
#   切成两个窗口各留一条，这里不会。
# - **删除顺序从最旧的往回删**（"从后往前"）：中途失败时留下的是最新的那批，
#   而不是把最近的一次构建先删掉。
# - 最新的一条永远是锚点、不会被删 —— 即便它同时是 GitHub 标为 Latest 的那个
#   也安全（仓库里全是预发布时，Latest 会落在它身上）。
# - **默认 dry_run=true**：第一次跑先看列表，确认无误后取消勾选再跑一次才真删。
#   删除不可撤销（Release 连同资产一起没），所以默认值选保守。

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: 保留窗口（小时）—— 每个窗口内只留最新的 1 个预发布
        type: string
        default: '24'
      dry_run:
        description: 只预览不删除（去掉勾选才真删）
        type: boolean
        default: true
      cleanup_tag:
        description: 删除 Release 时一并删除关联 tag
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  clear:
    name: 清理预发布
    runs-on: ubuntu-latest
    steps:
      - name: 列出待清理的预发布
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_HOURS: ${{ github.event.inputs.window_hours }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          # 全量拉取：Release 数量远超单页 100 条，不翻页会漏掉最旧的那批
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json

          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timedelta, timezone

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          raw_h = (os.environ.get("WINDOW_HOURS") or "").strip() or "24"
          try:
              window = float(raw_h)
          except ValueError:
              die(f"window_hours 不是数字：{raw_h!r}")
          if window <= 0:
              die(f"window_hours 必须为正数：{window}")
          window_td = timedelta(hours=window)
          dry = (os.environ.get("DRY_RUN") or "").strip().lower() == "true"

          raw = open("/tmp/releases.json", encoding="utf-8").read().strip()
          if not raw:
              die("拉取 Release 列表为空")

          # gh api --paginate 对数组响应会合并成一个数组；万一逐页原样拼接
          # （[...][...]）就不是一个合法的 JSON —— 这里用 raw_decode 逐个吃掉，
          # 两种形态都能读。
          dec, items, i = json.JSONDecoder(), [], 0
          while i < len(raw):
              obj, i = dec.raw_decode(raw, i)
              if isinstance(obj, list):
                  items.extend(obj)
              else:
                  items.append(obj)
              while i < len(raw) and raw[i] in " \t\r\n,":
                  i += 1

          # 字段名两套都认：gh api 给 REST 的 snake_case，gh --json 给 camelCase
          def pick(r, *keys):
              for k in keys:
                  v = r.get(k)
                  if v:
                      return v
              return ""

          def when(r):
              v = pick(r, "created_at", "createdAt", "published_at", "publishedAt")
              if not v:
                  return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(v.replace("Z", "+00:00"))

          pres = [r for r in items
                  if pick(r, "prerelease", "isPrerelease") in (True, "true")
                  and pick(r, "draft", "isDraft") not in (True, "true")]

          if not pres:
              print("没有预发布，无需清理")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  open(summary, "a", encoding="utf-8").write("## Clear Release\n\n没有预发布。\n")
              sys.exit(0)

          # 从新到旧贪心：命中窗口的第一条（即该窗口内最新的）留下当锚点
          pres.sort(key=when, reverse=True)
          keep, drop, anchor = [], [], None
          for r in pres:
              t = when(r)
              if anchor is None or (anchor - t) >= window_td:
                  keep.append(r)
                  anchor = t
              else:
                  drop.append(r)

          def line(r, act):
              tag = pick(r, "tag_name", "tagName")
              t = when(r)
              ts = t.strftime("%Y-%m-%d %H:%M") if t.year > 1 else "?"
              name = (pick(r, "name") or "").replace("|", "/")
              return f"| `{tag}` | {ts} UTC | {act} | {name} |"

          rows = ["| tag | 创建时间 | 处理 | 标题 |", "|---|---|---|---|"]
          rows += [line(r, "保留") for r in keep]
          # 删除列表按**从旧到新**写出，下一步照这个顺序删
          rows += [line(r, "删除") for r in reversed(drop)]
          plan = "\n".join(rows)

          print(f"预发布 {len(pres)} 个：保留 {len(keep)}，删除 {len(drop)}（窗口 {window:g} 小时）")
          print(plan)
          print("dry run" if dry else "将执行删除")

          # newline 显式给 "\n"：不让文本模式做换行转换（tag 里混进 \r 会让 gh 找不到）
          open("/tmp/delete.txt", "w", encoding="utf-8", newline="\n").write(
              "".join(f"{pick(r, 'tag_name', 'tagName')}\n" for r in reversed(drop)))

          tail = "\n**dry run：以上只是预览，实际没有删除。**\n" if dry else ""
          print(tail.strip())

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("## Clear Release\n\n")
                  f.write(f"窗口 **{window:g} 小时**，内只留最新的 1 个预发布。"
                          f"共 {len(pres)} 个预发布：保留 {len(keep)}，删除 {len(drop)}。\n\n")
                  f.write(plan + "\n")
                  f.write(tail)
          PY

      - name: 执行删除
        # dry_run 关掉才真删；列表为空时下一步自己会退出
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_TAG: ${{ github.event.inputs.cleanup_tag }}
        run: |
          set -euo pipefail

          if [ ! -s /tmp/delete.txt ]; then
            echo "没有需要删除的预发布"
            exit 0
          fi

          FLAG=""
          [ "$CLEANUP_TAG" = "true" ] && FLAG="--cleanup-tag"

          ok=0
          fail=0
          # /tmp/delete.txt 已从旧到新排好：中途失败时留下的是最新的那批
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if gh release delete "$tag" --yes $FLAG; then
              echo "已删除 $tag"
              ok=$((ok+1))
            else
              # 单个失败不中断（tag 受保护 / 权限不足等），剩下的继续删
              echo "::warning::删除失败：$tag"
              fail=$((fail+1))
            fi
          done < /tmp/delete.txt

          echo "删除完成：成功 $ok，失败 $fail"
          {
            echo
            echo "## 结果"
            echo
            echo "- 成功删除：$ok"
            echo "- 删除失败：$fail"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -gt 0 ]; then
            echo "::warning::$fail 个预发布删除失败，见上面的日志"
          fi
