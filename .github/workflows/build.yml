name: Build

# 可复用构建工作流（workflow_call）：只负责把包做出来。产物规则与背景见 docs/agent/release.md。

on:
  workflow_call:
    inputs:
      channel:
        description: alpha / beta / release —— 写入编译期 SUWAYOMI_BUILD_TYPE
        required: true
        type: string
      channel_suffix:
        description: 产物名与镜像标签里的通道段（仅 beta 为 -beta，其余通道为空串）
        required: true
        type: string
      pack_core:
        description: 是否产出核心包（不含 JRE 的那份）；与 pack_jre 正交，两者都关就没有可发布的包
        required: false
        type: boolean
        default: false
      version_name:
        description: 版本名（release/beta 为 3.y.z，alpha 为 r{code}）
        required: true
        type: string
      count:
        description: 提交数（versionCode = count + 3000，由 build.rs 推导）
        required: true
        type: string
      webui_url:
        description: 捆绑的 WebUI zip 下载地址（调用方解析一次，所有 target 复用同一份）
        required: true
        type: string
      ext_runtime_url:
        description: 捆绑的 ext-runtime.jar 下载地址（Suwayomi-ext-runtime 的 Release 资产，免鉴权；调用方解析一次，所有 target 复用同一份）
        required: true
        type: string
      ext_runtime_version:
        description: 捆绑的 ext-runtime 版本号，用于编译期标记、日志与拼 JRE 资产名
        required: true
        type: string
      ext_runtime_jre_base:
        description: ext-runtime 该版本 Release 的资产下载前缀（裁剪 JRE 按 <base>/ext-runtime-jre-<V>-<os>-<arch>.tar.gz 取）
        required: true
        type: string
      tray_version:
        description: 桌面壳版本号（Suwayomi-tray 的 Release 版本）；空串表示没解析到制品，本包不含桌面壳
        required: false
        type: string
        default: ''
      tray_base:
        description: 桌面壳该版本 Release 的资产下载前缀（按 <base>/suwayomi-tray-<V>-<target>[.exe] 取）
        required: false
        type: string
        default: ''
      targets:
        description: 桌面/服务端构建矩阵 include 数组（JSON 字符串，不含 Android；可为空数组）
        required: true
        type: string
      pack_jre:
        description: 是否产出 +jre 包（在核心包内容之上追加对应架构的裁剪 JRE；裁剪在 Suwayomi-ext-runtime 做，这里只下载资产）
        required: false
        type: boolean
        default: true
      pack_msi:
        description: 是否在 Windows 上出 msi 安装包（WiX v7 打包，装的内容是 +jre 那份）
        required: false
        type: boolean
        default: true
      pack_exe:
        description: 是否在 Windows 上出 setup.exe 安装包（Burn bundle，把 msi 裹成单文件；内部照样会先构建 msi）
        required: false
        type: boolean
        default: false
      android_targets:
        description: Android 构建矩阵 include 数组（JSON 字符串，元素含 target/abi/rust_target；可为空数组）
        required: true
        type: string
      pack_oci:
        description: 是否额外构建 OCI 镜像并推送到 GHCR（linux/amd64 与 linux/arm64 多架构）
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    # 空矩阵会让 Actions 直接报错，所以空数组时显式跳过。
    if: inputs.targets != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}
    env:
      CARGO_TERM_COLOR: always
      SUWAYOMI_VERSION_COUNT: ${{ inputs.count }}
      # 两种模式统一传入；alpha 的 r{count+3000} 与 build.rs 的回退值一致。
      SUWAYOMI_VERSION_NAME: ${{ inputs.version_name }}
      SUWAYOMI_BUILD_TYPE: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装交叉编译工具链
        # 只有 x86_64 runner 出 aarch64 包才需要交叉工具链。
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu' && runner.arch == 'X64'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      # 托盘壳、沙盒 jar、裁剪 JRE 都是下载来的资产，本仓库不再跑 JVM 工具链。
      - name: 构建
        shell: bash
        run: |
          cargo build --release -p suwayomi-server --target ${{ matrix.rust_target }}
      - name: 打包
        id: pack
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"
          BIN="target/${{ matrix.rust_target }}/release/suwayomi-server"
          # 判平台一律用 runner.os，别拿 matrix.os 的 runner 标签比字面量。
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi

          IS_WIN="false"
          [ "${{ runner.os }}" = "Windows" ] && IS_WIN="true"

          # 通道段由调用方给出，只有 beta 非空（beta 与 release 共用 3.y.z，不区分会重名）。
          BASE="Suwayomi-${VER}${{ inputs.channel_suffix }}-${TGT}"

          # 暂存目录就是「默认包」；+jre 在它基础上复制一份再追加 JRE。
          STAGE="dist/${BASE}"
          rm -rf "$STAGE" "dist/${BASE}+jre"
          mkdir -p "$STAGE/bin"
          cp "$BIN" "$STAGE/bin/"

          # 托盘壳所有桌面 target 都要（Android 不在这个矩阵里）；取不到只告警，不挡发布。
          TRAY_VER="${{ inputs.tray_version }}"
          TRAY_BASE="${{ inputs.tray_base }}"
          if [ -z "$TRAY_VER" ] || [ -z "$TRAY_BASE" ]; then
            echo "::warning::未解析到桌面壳制品，本包不含托盘壳"
          else
            TRAY_ASSET="suwayomi-tray-${TRAY_VER}-${TGT}"
            [ "$IS_WIN" = "true" ] && TRAY_ASSET="${TRAY_ASSET}.exe"
            TRAY_OUT="$STAGE/suwayomi"
            [ "$IS_WIN" = "true" ] && TRAY_OUT="$STAGE/suwayomi.exe"
            if curl -fsSL --retry 2 -o "$TRAY_OUT" "$TRAY_BASE/$TRAY_ASSET"; then
              echo "桌面壳 ${TRAY_VER} → $TRAY_OUT"
            else
              rm -f "$TRAY_OUT"
              echo "::warning::桌面壳资产下载失败（$TRAY_BASE/$TRAY_ASSET），本包不含托盘壳"
            fi
          fi

          # -f 必须加：GitHub 对失败请求返回 HTML/JSON，不加会把响应体当 jar 存下来。
          curl -fsSL -o "$STAGE/bin/ext-runtime.jar" "${{ inputs.ext_runtime_url }}"
          # 落地校验能列出主类才算真 jar；用 python3 而非 `unzip -l`，Git for Windows 的 bash 没有 unzip。
          python3 -c "import sys,zipfile; sys.exit(0 if 'sandbox/MainKt.class' in zipfile.ZipFile(sys.argv[1]).namelist() else 1)" \
            "$STAGE/bin/ext-runtime.jar" \
            || { echo "::error::ext-runtime.jar 内容异常（缺 sandbox/MainKt.class）"; exit 1; }
          echo "ext-runtime ${{ inputs.ext_runtime_version }} → $STAGE/bin/ext-runtime.jar"
          # WebUI：调用方已按通道解析好，所有 target 用同一份
          curl -sL -o webui.zip "${{ inputs.webui_url }}"
          mkdir -p "$STAGE/webui"
          python3 -c "import zipfile; zipfile.ZipFile('webui.zip').extractall('$STAGE/webui')"
          rm -f webui.zip
          # data/ 与 appdata/ 的目录树来自 assets/templates/directory —— 清单只有那一份，
          # 这里、build.bat、Dockerfile 都只负责复制。先建好省得首启现造（MSIX 与
          # per-machine 安装会把 appdata 整根外指）。
          # .gitkeep 是给 Git 留空目录用的占位，不属产物内容。
          cp -R assets/templates/directory/. "$STAGE/"
          find "$STAGE" -name .gitkeep -delete

          zip_dir() {
            powershell -Command "Compress-Archive -Path '$1' -DestinationPath '$2' -Force"
          }

          # 压包：Windows 出 zip，其余出 tar.gz。结果放 $ARCHIVE。
          ARCHIVE=""
          pack_dir() {
            local dir="$1"
            if [ "$IS_WIN" = "true" ]; then
              zip_dir "$dir" "${dir}.zip"
              ARCHIVE="${dir}.zip"
            else
              tar -C dist -czf "${dir}.tar.gz" "$(basename "$dir")"
              ARCHIVE="${dir}.tar.gz"
            fi
          }

          ARTIFACTS=""
          # 核心包与 +jre 包是两个正交开关：早先「出不出基线包」由 pack_mode 隐式决定，现在由调用方显式给 pack_core。
          if [ "${{ inputs.pack_core }}" = "true" ]; then
            pack_dir "$STAGE"
            ARTIFACTS="$ARCHIVE"
          fi
          if [ "${{ inputs.pack_jre }}" = "true" ]; then
            JRE_DIR="dist/${BASE}+jre"
            cp -r "$STAGE" "$JRE_DIR"
            # 裁剪 JRE 由 Suwayomi-ext-runtime 用 jlink 出（模块白名单跟沙盒走），这里只下载解开。
            JRE_ASSET="ext-runtime-jre-${{ inputs.ext_runtime_version }}-${{ matrix.jre_os }}-${{ matrix.jre_arch }}.tar.gz"
            curl -fsSL --retry 3 -o "$JRE_ASSET" "${{ inputs.ext_runtime_jre_base }}/$JRE_ASSET"
            tar -xzf "$JRE_ASSET" -C "$JRE_DIR"
            rm -f "$JRE_ASSET"
            # 取错资产（如 Windows 上放个 ELF）只在装上运行时才炸，所以跑一次 -version。
            if [ "${{ matrix.jre_os }}" = "windows" ]; then
              JAVA_BIN="$JRE_DIR/jre/bin/java.exe"
            else
              JAVA_BIN="$JRE_DIR/jre/bin/java"
            fi
            test -f "$JAVA_BIN" || { echo "::error::JRE 资产内容异常（缺 $JAVA_BIN）"; exit 1; }
            "$JAVA_BIN" -version
            pack_dir "$JRE_DIR"
            ARTIFACTS="${ARTIFACTS:+$ARTIFACTS$'\n'}$ARCHIVE"
          fi
          rm -rf "$STAGE"

          # 兜底：调用方把两种包都关了。release.yml 的 prep 已先拦一道，这里是 build.yml 自己的防线。
          if [ -z "$ARTIFACTS" ]; then
            echo "::error::没有任何产物可出（core=${{ inputs.pack_core }} jre=${{ inputs.pack_jre }}）"
            exit 1
          fi

          {
            echo "artifacts<<ARTIFACTS_EOF"
            printf '%s\n' "$ARTIFACTS"
            echo "ARTIFACTS_EOF"
            echo "artifact_name=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "packed artifacts:"
          echo "$ARTIFACTS" | sed 's/^/  /'
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}
      - name: 打包 Windows 安装包（msi / setup.exe）
        id: msi
        if: runner.os == 'Windows' && (inputs.pack_msi || inputs.pack_exe)
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"
          BASE="Suwayomi-${VER}${{ inputs.channel_suffix }}-${TGT}"
          PAYLOAD="dist/${BASE}+jre"
          # msi 装的就是 +jre 那份；调用方开了 pack_msi 却没出 +jre 时在这里直接失败，别静默出个空包。
          [ -d "$PAYLOAD" ] || { echo "::error::pack_msi 需要 +jre 产物（$PAYLOAD 不存在）"; exit 1; }

          ARCH="x64"; [ "${{ matrix.jre_arch }}" = "aarch64" ] && ARCH="arm64"
          # MSI 版本必须数字点分且 major < 256（alpha 的 r{code}、versionCode 都不合法），沿用 beta/release 同款的 3.yy.zz。
          COUNT="${{ inputs.count }}"
          MSI_VERSION="3.$((COUNT / 100)).$((COUNT % 100))"
          # bindpath 与 -d 的相对路径都以 .wxs 所在目录为基准（不是 cwd），所以这里一律给 Windows 绝对路径。
          PAYLOAD_DIR="$(cd "$PAYLOAD" && pwd -W)"
          ICON_DIR="$(cd assets/images && pwd -W)"
          RTF_FILE="$(cd packaging/windows && pwd -W)/License.rtf"
          LOC_FILE="$(cd packaging/windows/loc && pwd -W)/WixUI_zh-CN.wxl"
          BMP_DIR="$(cd packaging/windows/Bitmaps && pwd -W)"
          HAS_TRAY="no"; [ -f "$PAYLOAD/suwayomi.exe" ] && HAS_TRAY="yes"
          # 序列 id 带架构后缀（Suwayomi_InstallDir_X64 / _A64），裸名是私有的，引用它报 WIX0094。
          UI_ARCH="X64"
          if [ "$ARCH" = "arm64" ]; then UI_ARCH="A64"; fi
          # ProductCode 对同一个 MSI_VERSION 必须稳定：msi 靠它认「已安装的是同一个产品」，
          # 每次现生成的话，双击同一个包会被当成首次安装，用户看不到修改/卸载。跨版本换 ProductCode
          # 是对的，由 MajorUpgrade 用 UpgradeCode + 版本号接管。
          HASH="$(printf 'Suwayomi.Next/%s' "$MSI_VERSION" | md5sum | cut -c1-32 | tr 'a-z' 'A-Z')"
          PRODUCT_CODE="{${HASH:0:8}-${HASH:8:4}-${HASH:12:4}-${HASH:16:4}-${HASH:20:12}}"

          dotnet tool install --global wix --version 7.0.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Bal 扩展的包名是 WixToolset.Bal.wixext，但内部 dll 与扩展 id 都是 WixToolset.BootstrapperApplications.wixext，用包名装会被判 damaged。
          wix extension add -g --acceptEula wix7 WixToolset.BootstrapperApplications.wixext
          wix extension add -g --acceptEula wix7 WixToolset.UI.wixext

          MSI="dist/${BASE}.msi"
          # UI 扩展提供向导的对话框定义，Suwayomi.UI.wxs 提供序列（要一起构建，否则它的 UIRef 找不到），
          # -loc 提供中文文案（只给 -loc 而漏了 -culture 时各页会退回英文）。
          wix build packaging/windows/Suwayomi.wxs packaging/windows/Suwayomi.UI.wxs \
            --acceptEula wix7 -arch "$ARCH" \
            -ext WixToolset.UI.wixext -culture zh-CN -loc "$LOC_FILE" \
            -b "payload=$PAYLOAD_DIR" -d Version="$MSI_VERSION" \
            -d ProductCode="$PRODUCT_CODE" \
            -d IconFile="$ICON_DIR/icon.ico" -d HasTray="$HAS_TRAY" \
            -d UiArch="$UI_ARCH" -d LicenseRtf="$RTF_FILE" \
            -d BannerBmp="$BMP_DIR/banner.bmp" -d DialogBmp="$BMP_DIR/dialog.bmp" \
            -pdbtype none -o "$MSI"
          # ICE 是静态一致性校验，能提前抓到 per-user/per-machine 混用与 key path 之类的问题。
          # ICE57 定向抑制：快捷方式组件用 HKMU 的注册表值当 key path 以跟随安装范围，而 ICE57 不认
          # perUserOrMachine 这种 configurable scope，一律判成 per-user 与 per-machine 混用。其余 ICE 照跑。
          wix msi validate "$MSI" --acceptEula wix7 -sice ICE57

          FILES=()
          if [ "${{ inputs.pack_msi }}" = "true" ]; then FILES+=("$MSI"); fi
          # setup.exe 是 msi 的 Burn 外壳：勾了 pack_exe 就顺手构建，但 msi 本身进不进附件只看 pack_msi。
          if [ "${{ inputs.pack_exe }}" = "true" ]; then
            SETUP="dist/${BASE}-setup.exe"
            wix build packaging/windows/Suwayomi.Bundle.wxs --acceptEula wix7 \
              -ext WixToolset.BootstrapperApplications.wixext \
              -d Version="$MSI_VERSION" -d MsiPath="$MSI" -d IconFile="$ICON_DIR/icon.ico" \
              -pdbtype none -o "$SETUP"
            FILES+=("$SETUP")
          fi

          ls -la "${FILES[@]}"
          {
            echo "artifacts<<ARTIFACTS_EOF"
            printf '%s\n' "${FILES[@]}"
            echo "ARTIFACTS_EOF"
            echo "artifact_name=${BASE}-installer"
          } >> "$GITHUB_OUTPUT"
      - name: 上传安装包
        if: runner.os == 'Windows' && (inputs.pack_msi || inputs.pack_exe)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.msi.outputs.artifact_name }}
          path: ${{ steps.msi.outputs.artifacts }}

  android:
    name: 构建 ${{ matrix.target }}
    # 与桌面矩阵同一套写法：include 由调用方按勾选拼好，空数组时整个 job 跳过。
    if: inputs.android_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.android_targets) }}
    env:
      CARGO_TERM_COLOR: always
      SUWAYOMI_VERSION_COUNT: ${{ inputs.count }}
      SUWAYOMI_VERSION_NAME: ${{ inputs.version_name }}
      SUWAYOMI_BUILD_TYPE: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装 JDK
        # Gradle 9 需要 ≥ 17；与另外几处保持同一个 25，避免"本地能跑、CI 不能"。
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: 安装 Android SDK 组件
        # compileSdk 37 与 NDK 28.2 不在预装列表里；平台包名是 android-37.0，裸 android-37 不存在。
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "ndk;28.2.13676358"
      - name: 交叉编译 Rust server（cdylib）
        # 产出 jniLibs/<abi>/libsuwayomi_android.so，ABI 由矩阵给出。
        run: ABI=${{ matrix.abi }} bash android/scripts/build-rust.sh
      - name: 打包 WebUI 进 assets
        run: |
          curl -sL -o webui.zip "${{ inputs.webui_url }}"
          bash android/scripts/package-webui.sh webui.zip
      - name: 准备 release 签名（可选）
        # 没配 secret 就回退 AGP 的 debug key；临时 key 每次 CI 都不同，跨次覆盖安装前需先卸载。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/keystore.jks
            {
              echo "SUWAYOMI_KEYSTORE=keystore.jks"
              echo "SUWAYOMI_KEYSTORE_PASSWORD=$KS_PASS"
              echo "SUWAYOMI_KEY_ALIAS=${KEY_ALIAS:-suwayomi}"
              echo "SUWAYOMI_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "已注入 release keystore"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，APK 将用临时 debug key 签名（跨次安装需先卸载）"
          fi
      - name: 取 ext-runtime 共享源码
        # Android 侧只能吃源码（AGP 的 Kotlin 读不了 ext-runtime 的元数据），取同一个 release 的 -shared-sources 资产。
        run: bash android/scripts/fetch-ext-runtime-src.sh "${{ inputs.ext_runtime_version }}"
      - name: Gradle 构建 APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: 打包产物
        id: pack
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"

          # 与桌面产物同一套命名；Android 不打包 JRE，所以没有 +jre 后缀。
          NAME="Suwayomi-${VER}${{ inputs.channel_suffix }}-${TGT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "::error::找不到 $APK"; ls -R android/app/build/outputs/apk 2>/dev/null; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/${NAME}.apk"

          {
            echo "artifacts=dist/${NAME}.apk"
            echo "artifact_name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "packed: dist/${NAME}.apk ($(du -h "dist/${NAME}.apk" | cut -f1))"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}

  # OCI 镜像：独立构建、不含托盘壳，只推 GHCR 不进 Release 附件；两个架构各跑同架构 runner。
  oci:
    name: 构建 OCI ${{ matrix.arch }}
    if: inputs.pack_oci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest,    platform: linux/amd64 }
          - { arch: arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7
      - name: 解析镜像标签
        id: meta
        # 标签同产物名规则；GHCR 只接受小写仓库名，所以转小写。
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ inputs.version_name }}${{ inputs.channel_suffix }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "镜像：${IMAGE}:${TAG}-${{ matrix.arch }}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          # 先只 load 到本地 daemon（不 push）：冒烟通过后才在下一步推上去
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            WEBUI_URL=${{ inputs.webui_url }}
            EXT_RUNTIME_VERSION=${{ inputs.ext_runtime_version }}
            VERSION_NAME=${{ inputs.version_name }}
            VERSION_COUNT=${{ inputs.count }}
            BUILD_TYPE=${{ inputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version_name }}
          cache-from: type=gha,scope=oci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=oci-${{ matrix.arch }}
          # 关掉 provenance：imagetools 合成 manifest 时混进 attestation 会多出平台未知条目。
          provenance: false
      - name: 冒烟测试镜像
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMG="${IMAGE}:${TAG}-${ARCH}"
          # 静态：二进制能跑（缺 libssl 会直接起不来）、JRE 与 glibc 兼容、三件套都在。
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            /opt/suwayomi/bin/suwayomi-server --version
            /opt/suwayomi/jre/bin/java -version
            test -f /opt/suwayomi/webui/index.html
            test -f /opt/suwayomi/bin/ext-runtime.jar
            if ldd /opt/suwayomi/bin/suwayomi-server | grep -q "not found"; then
              echo "缺少动态库："
              ldd /opt/suwayomi/bin/suwayomi-server | grep "not found"
              exit 1
            fi
          '
          # 动态：真起一个容器，等到 HTTP 有响应为止。宿主侧用 18090，避开本机跑着的实例。
          docker run -d --name oci-smoke -p 18090:4567 "$IMG"
          code="000"
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/ || true)"
            [ "$code" != "000" ] && break
            sleep 2
          done
          docker logs oci-smoke 2>&1 | tail -30 || true
          docker rm -f oci-smoke >/dev/null 2>&1 || true
          [ "$code" != "000" ] || { echo "::error::容器 60 秒内没有任何 HTTP 响应"; exit 1; }
          echo "容器响应 HTTP $code"
      - name: 推送镜像
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: docker push "${IMAGE}:${TAG}-${ARCH}"

  oci_manifest:
    name: 合成 OCI 多架构 manifest
    if: inputs.pack_oci
    needs: oci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: imagetools create
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.version_name }}${{ inputs.channel_suffix }}
        run: |
          IMAGE="${IMAGE,,}"
          # 两个单架构标签都在才合成，缺一个就明确失败。
          docker buildx imagetools inspect "${IMAGE}:${TAG}-amd64" >/dev/null
          docker buildx imagetools inspect "${IMAGE}:${TAG}-arm64" >/dev/null
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
