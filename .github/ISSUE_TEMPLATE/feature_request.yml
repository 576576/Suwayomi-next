name: 功能请求
description: 提出新增能力或对现有行为的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先检索既有 issue，以及 `docs/agent/plans/` 下的计划文档，部分方向已有既定结论。
        扩展（图源）相关的需求请向扩展所在仓库提出。

  - type: textarea
    id: requirement
    attributes:
      label: 需求描述
      description: 说明当前做法的不足与期望达到的效果。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      description: 可多选。
      multiple: true
      options:
        - WebUI 前端
        - 服务端（GraphQL / REST / OPDS）
        - 桌面壳
        - 扩展运行时
        - 打包与分发
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已尝试的变通做法，或考虑过的其他设计。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 已检索既有 issue，确认不是重复请求。
          required: true
        - label: 该需求不属于扩展（图源）自身。
          required: true
