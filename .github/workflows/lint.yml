name: Lint

# 质量门禁：格式 / 静态检查 / 测试，每次 push 与 PR 都跑（背景见 docs/release.md）。
on:
  push:
    branches-ignore:
      - "gh-pages"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 检查格式
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 静态检查
        # lint 级别由根 Cargo.toml 的 [workspace.lints] 统一定义，测试代码在 crate 根部豁免。
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    # 20 个用例只在 DATABASE_URL / SUWAYOMI_TEST_DB 存在时才连库，缺了会静默 return。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # 等 PG 真的接受连接再开始跑测试。
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 两个名字都设：多数用例读 DATABASE_URL，内联的那几个只认它。
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SUWAYOMI_TEST_DB: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        # --no-fail-fast：默认在第一个失败的测试二进制处就收工，一轮要拿到全部失败。
        run: cargo test --workspace --no-fail-fast
