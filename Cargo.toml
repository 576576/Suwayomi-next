[workspace]
resolver = "2"
members = [
    "crates/suwayomi-core",
    "crates/suwayomi-db",
    "crates/suwayomi-db-macros",
    "crates/suwayomi-domain",
    "crates/suwayomi-rest",
    "crates/suwayomi-graphql",
    "crates/suwayomi-opds",
    "crates/suwayomi-server",
    "crates/suwayomi-android",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/Suwayomi/Suwayomi-next"
authors = ["Suwayomi-next Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
suwayomi-db = { path = "crates/suwayomi-db" }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
async-graphql = "7"
async-graphql-axum = "7"
# 基础特性显式列出（等价于默认特性，去掉 default-tls）：TLS 后端按目标平台分开补
# —— 见 crates/suwayomi-domain/Cargo.toml
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "cookies", "charset", "http2"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
base64 = "0.22"
flate2 = "1"
# Local-source archive chapters (ZIP/CBZ read support; deflate only).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Local-source archive metadata (ComicInfo.xml inside CBZ).
quick-xml = "0.36"

[profile.release]
lto = "thin"

# Android 交叉编译专用 profile，唯一目的是绕开工具链问题：
#
# `lto = false` —— rustc（stable，Windows 宿主）在 `--target aarch64-linux-android`
# 下做 thin-LTO 会自己崩掉（exit 0xc0000005 STATUS_ACCESS_VIOLATION），
# 崩点在编译 `suwayomi-db` 时的 rustc 进程内，与代码无关；关掉 LTO 即可稳定出包。
#
# 其余保持继承 release（含 `panic = "unwind"`：JNI 入口靠 `catch_unwind`
# 把 panic 变成返回码而不是直接杀进程，改用 abort 会丢掉这个语义）。
#
# 用 `cargo build --profile android-release --target aarch64-linux-android`。
[profile.android-release]
inherits = "release"
lto = false
