name: Auto build

# alpha 发布 CI：推送 main / dev 时自动构建 alpha，仅 Windows x64。
# 手动多通道/多架构发布走 release.yml（workflow_dispatch）。
#
# 捆绑的 WebUI 制品固定取最新构建（r{code} 预发布，见 scripts/resolve-webui.sh），
# 与通道语义一致：alpha 永远跟最新提交，不等正式 release。
#
# alpha 版本号（见 crates/suwayomi-server/build.rs）：
# - 内部 versionCode = commit count + 3000（46 次提交 -> 3046）
# - alpha versionName = r{versionCode}（46 -> r3046）；正式外部版本号
#   （3.x.y）由 release.yml 手动发布使用

on:
  push:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 alpha (windows-x64)
    runs-on: windows-latest
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
      count: ${{ steps.ver.outputs.count }}
      tag: ${{ steps.ver.outputs.tag }}
      # 捆绑的 WebUI 版本（打包时解析），供 publish 写进发布说明
      webui_tag: ${{ steps.pack.outputs.webui_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: ver
        name: 计算版本号
        shell: bash
        run: |
          COUNT="$(git rev-list --count HEAD)"
          VER_CODE="$((COUNT+3000))"
          VER_NAME="r${VER_CODE}"
          TAG="${VER_NAME}-alpha.${{ github.run_id }}"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "alpha build: $VER_NAME (code $VER_CODE, commits $COUNT) -> $TAG"
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: 安装 JDK（扩展沙盒构建）
        # jvm-sandbox 的 gradle toolchain 统一 25（与发布捆绑的 JRE 25 一致）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: 构建
        # 版本计数与发布通道都在编译期注入：core/build.rs 读它们生成常量，
        # 供 aboutServer.version / buildType 上报给 WebUI。
        # NB: Windows runner 默认 PowerShell，故显式声明 shell: bash。
        shell: bash
        env:
          SUWAYOMI_VERSION_COUNT: ${{ steps.ver.outputs.count }}
          # alpha CI 固定 alpha 通道（不注入的话 build.rs 会退回 release）
          SUWAYOMI_BUILD_TYPE: alpha
        run: |
          cargo build --release -p suwayomi-server --target x86_64-pc-windows-msvc
      - name: 打包
        id: pack
        shell: bash
        env:
          # 供 scripts/resolve-webui.sh 的 gh api 使用（跨仓库读公开仓库的 release）
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version_name }}"
          CH="alpha"
          TGT="windows-x64"
          BIN="target/x86_64-pc-windows-msvc/release/suwayomi-server.exe"

          # 产物命名：Suwayomi-r3046-windows-x64.zip（无 Next、无 -alpha 后缀）。
          # 本 CI 固定捆绑 Temurin JRE 25，故标准包名为 ...+jre；Electron 包在其
          # 基础上再带桌面壳，命名为 ...+electron+jre（后缀语义与 release.yml 相同）。
          # NB: 本 CI 没有勾选框，**两个包都产** —— 不适用 release.yml 那条
          # 「JRE 与 Electron 同时勾选时只产 +electron+jre」的合并规则。
          STAGE="dist/Suwayomi-${VER}-${TGT}+jre"
          STAGE_EL="dist/Suwayomi-${VER}-${TGT}+electron+jre"
          mkdir -p "$STAGE/bin"
          cp "$BIN" "$STAGE/bin/"
          # 桌面壳（Tauri 托盘+设置）——build-tray.sh 注入真实版本号到 Windows 资源
          bash suwayomi-tray/build-tray.sh
          cp suwayomi-tray/target/release/suwayomi.exe "$STAGE/" 2>/dev/null || true

          # 扩展沙盒（JVM，Kotlin fat jar）——放 bin/（server 自动查找）
          cd jvm-sandbox && ./gradlew -q jar --no-daemon && cd ..
          cp jvm-sandbox/build/libs/suwayomi-jvm-sandbox.jar "$STAGE/bin/jvm-sandbox.jar"

          # 捆绑 Temurin JRE 25（jre/）——sandbox 运行时自包含，无需系统 JDK
          curl -sL -o temurin-jre.zip "https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jre/hotspot/normal/eclipse"
          python3 -c "import zipfile,os; z=zipfile.ZipFile('temurin-jre.zip'); t=z.namelist()[0].split('/')[0]; z.extractall('jre-tmp'); z.close(); os.rename('jre-tmp/'+t, '$STAGE/jre')"
          rm -rf jre-tmp temurin-jre.zip
          # 捆绑 oliphaunt 原生 runtime（编译期 OUT_DIR 路径在用户机器不存在，
          # server 运行时回退到 exe 同级 oliphaunt-runtime/resources）
          RES=$(find target -path "*/release/build/suwayomi-core-*/out/oliphaunt/resources" -type d 2>/dev/null | head -1)
          if [ -n "$RES" ] && [ -d "$RES" ]; then
            mkdir -p "$STAGE/oliphaunt-runtime"
            cp -r "$RES" "$STAGE/oliphaunt-runtime/resources"
            echo "bundled oliphaunt runtime from $RES"
          else
            echo "WARN: no oliphaunt resources found to bundle"
          fi

          # ---- 捆绑 WebUI（fork 最新构建产物 r{code}）+ data 目录。
          #      alpha 通道始终跟最新构建，与 scripts/resolve-webui.sh 的 build 类型一致；
          #      三级兜底（gh api → 匿名 API → 匿名 HTML），拿不到则打 ::error:: 并中止。----
          WEBUI_ZIP="$(bash scripts/resolve-webui.sh build)"
          # .../releases/download/<tag>/<asset>.zip -> <tag>
          WEBUI_TAG="${WEBUI_ZIP#*/download/}"
          WEBUI_TAG="${WEBUI_TAG%%/*}"
          echo "webui_tag=$WEBUI_TAG" >> "$GITHUB_OUTPUT"
          echo "webui zip (build): $WEBUI_ZIP"
          curl -sL -o webui.zip "$WEBUI_ZIP"
          mkdir -p "$STAGE/webui"
          python3 -c "import zipfile; zipfile.ZipFile('webui.zip').extractall('$STAGE/webui')"
          # WebUI 版本随构建自带 version.txt（server 只读它，见 local_webui_*）
          rm -f webui.zip
          mkdir -p "$STAGE/data/autobackup" "$STAGE/data/downloads" "$STAGE/data/local"
          powershell -Command "Compress-Archive -Path 'dist/Suwayomi-${VER}-${TGT}+jre' -DestinationPath 'dist/Suwayomi-${VER}-${TGT}+jre.zip' -Force"

          # ---- 带 Electron 壳的产物（+electron+jre，桌面窗口化 WebUI）----
          # 复制 JRE 版产物为基底，附加 electron v44.1.0 win32-x64 运行时 + 应用入口
          cp -r "$STAGE" "$STAGE_EL"
          ELECTRON_VER="v44.1.0"
          curl -sL -o electron.zip "https://github.com/electron/electron/releases/download/${ELECTRON_VER}/electron-${ELECTRON_VER}-win32-x64.zip"
          mkdir -p "$STAGE_EL/electron/resources/app"
          python3 -c "import zipfile; zipfile.ZipFile('electron.zip').extractall('$STAGE_EL/electron')"
          cp electron-app/main.js electron-app/package.json "$STAGE_EL/electron/resources/app/"
          # 窗口图标：与 main.js 的 BrowserWindow icon 配套（替代 Electron 默认图标）
          cp suwayomi-tray/icons/icon.ico "$STAGE_EL/electron/resources/app/icon.ico"
          rm -f electron.zip
          powershell -Command "Compress-Archive -Path 'dist/Suwayomi-${VER}-${TGT}+electron+jre' -DestinationPath 'dist/Suwayomi-${VER}-${TGT}+electron+jre.zip' -Force"

          echo "artifact=dist/Suwayomi-${VER}-${TGT}+jre.zip" >> "$GITHUB_OUTPUT"
          echo "artifact_el=dist/Suwayomi-${VER}-${TGT}+electron+jre.zip" >> "$GITHUB_OUTPUT"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Suwayomi-${{ steps.ver.outputs.version_name }}-windows-x64
          path: |
            dist/Suwayomi-${{ steps.ver.outputs.version_name }}-windows-x64+jre.zip
            dist/Suwayomi-${{ steps.ver.outputs.version_name }}-windows-x64+electron+jre.zip

  publish:
    name: 发布 alpha (${{ needs.build.outputs.version_name }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes 需要 git 仓库（读历史生成 changelog），
      # 而 publish job 无构建上下文——必须先 checkout（fetch-depth: 0 拿完整历史）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 alpha Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VER: ${{ needs.build.outputs.version_name }}
          CODE: ${{ needs.build.outputs.version_code }}
          COUNT: ${{ needs.build.outputs.count }}
          WEBUI_TAG: ${{ needs.build.outputs.webui_tag }}
        run: |
          gh release create "$TAG" \
            artifacts/* \
            --title "Suwayomi $VER (alpha)" \
            --notes "## Suwayomi $VER · alpha
          - versionName: $VER
          - versionCode: $CODE
          - commits: $COUNT
          - bundled WebUI: \`$WEBUI_TAG\` —— 取自 576576/Suwayomi-WebUI 的最新构建（预发布）
          - 构建: windows-x64（推送 main/dev 自动触发）
          - 产物: Suwayomi-${VER}-windows-x64+jre.zip（含捆绑 Temurin JRE 25）
          - 产物: Suwayomi-${VER}-windows-x64+electron+jre.zip（内置 Electron 桌面壳 + JRE）" \
            --prerelease \
            --generate-notes
