name: 💬 讨论与求助
description: 用法、配置、部署上的疑问，或还没有成形的想法
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        先看[使用文档](https://github.com/576576/Suwayomi-next/blob/main/docs/zh/user-guide.md)：
        目录结构、端口与顺延、认证、OPDS、反向代理都在里面。

        **确定的缺陷请走「Bug 报告」**，**明确的新功能请走「功能请求」** —— 混在这里容易漏。

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 说清楚想达成什么、卡在哪一步。
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: 主题
      options:
        - 安装与升级
        - 目录 / 数据迁移
        - 端口与网络访问
        - 认证与登录
        - OPDS / 第三方客户端
        - 扩展与图源
        - Docker 部署
        - 其他
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已经试过什么
      description: 改过哪些设置、看过哪些日志；贴关键几行即可
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 版本
      description: 见 WebUI「设置 → 高级 → 调试信息」里的 Version
      placeholder: 例如 r3347-alpha 或 3.2.93
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 我已读过使用文档，并搜索过已有 issue。
          required: true
        - label: 这不是一个可复现的缺陷（那种请用 Bug 模板）。
          required: true
