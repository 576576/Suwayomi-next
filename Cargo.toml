[workspace]
resolver = "2"
members = [
    "crates/suwayomi-core",
    "crates/suwayomi-domain",
    "crates/suwayomi-rest",
    "crates/suwayomi-graphql",
    "crates/suwayomi-opds",
    "crates/suwayomi-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Suwayomi/Suwayomi-next"
authors = ["Suwayomi-next Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "json"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
async-graphql = "7"
async-graphql-axum = "7"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "cookies"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
flate2 = "1"
# Embedded PostgreSQL — default database backend (Phase 6).
# Oliphaunt (the renamed pglite-oxide) native server: real local PostgreSQL
# process with independent client sessions, no external server/Docker.
oliphaunt = "0.1.1"
# Local-source archive chapters (ZIP/CBZ read support; deflate only).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Local-source archive metadata (ComicInfo.xml inside CBZ).
quick-xml = "0.36"

[profile.release]
lto = "thin"
