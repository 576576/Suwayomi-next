[workspace]
resolver = "2"
members = [
    "crates/suwayomi-core",
    "crates/suwayomi-domain",
    "crates/suwayomi-rest",
    "crates/suwayomi-graphql",
    "crates/suwayomi-opds",
    "crates/suwayomi-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Suwayomi/Suwayomi-next"
authors = ["Suwayomi-next Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "json"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
async-graphql = "7"
async-graphql-axum = "7"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "cookies"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
flate2 = "1"
# Embedded PostgreSQL (PGlite) — default database backend (Phase 6).
# Pinned to 0.3 (wasmtime runtime): 0.4+/0.5 switched to wasmer-wasix,
# whose alpha release fails to compile on current toolchains.
pglite-oxide = "=0.3.0"
# Local-source archive chapters (ZIP/CBZ read support; deflate only).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Local-source archive metadata (ComicInfo.xml inside CBZ).
quick-xml = "0.36"

# Local fork: the upstream TCP proxy terminates its accept loop when a single
# client connection errors (e.g. any SQL error ends the embedded session),
# which then makes every subsequent pool acquire hang until acquire_timeout.
# vendor/pglite-oxide keeps accepting after per-connection errors.
[patch.crates-io]
pglite-oxide = { path = "vendor/pglite-oxide" }

[profile.release]
lto = "thin"
