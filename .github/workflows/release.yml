name: Release

# 手动发布 CI：workflow_dispatch 触发，可选 alpha / beta / release 通道，
# 以勾选方式多选构建目标（GitHub 无 multi-select 输入，用 boolean 复选）。
# 可选捆绑（JRE / Electron，独立于架构勾选、仅 Windows x64 目标生效）：
# 无论勾选与否都会产出“两个都不捆绑”的基础单包（无后缀）；勾选后每个
# 捆绑再额外产出带 +jre / +electron(+jre) 后缀的包。
# 推送自动 alpha 走 release-alpha.yml。
#
# 版本号（见 crates/suwayomi-server/build.rs）：
# - 内部 versionCode = commit count + 3000（38 次提交 -> 3038）
# - 外部 versionName = 3.{count/100}.{(count/10)%10}（38 -> 3.0.3，100 -> 3.1.0）

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道
        type: choice
        options: [alpha, beta, release]
        default: release
      build_windows_x64:
        description: Windows x64
        type: boolean
        default: true
      build_linux_x64:
        description: Linux x64
        type: boolean
        default: true
      build_linux_arm64:
        description: Linux arm64
        type: boolean
        default: false
      build_macos_x64:
        description: macOS x64
        type: boolean
        default: false
      build_macos_arm64:
        description: macOS arm64
        type: boolean
        default: false
      bundle_jre:
        description: 额外产物 +jre（捆绑 Temurin JRE 25，仅 Windows x64 生效）
        type: boolean
        default: true
      bundle_electron:
        description: 额外产物 +electron（捆绑 Electron 桌面壳，仅 Windows x64 生效）
        type: boolean
        default: false
      version_count:
        description: 版本计数（留空自动使用提交数；用于预发布验证）
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    name: 准备构建参数
    runs-on: ubuntu-latest
    permissions:
      # 用于 PATCH 更新 workflow run 标题（Release x.y.z）
      actions: write
    outputs:
      channel: ${{ steps.out.outputs.channel }}
      targets: ${{ steps.out.outputs.targets }}
      version_name: ${{ steps.out.outputs.version_name }}
      version_code: ${{ steps.out.outputs.version_code }}
      count: ${{ steps.out.outputs.count }}
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
      bundle_jre: ${{ steps.out.outputs.bundle_jre }}
      bundle_electron: ${{ steps.out.outputs.bundle_electron }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: out
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"

          # 版本计数：手动可覆盖，否则 git 提交数
          COUNT="${{ github.event.inputs.version_count }}"
          if [ -z "$COUNT" ]; then COUNT="$(git rev-list --count HEAD)"; fi

          VER_NAME="3.$((COUNT/100)).$(((COUNT/10)%10))"
          VER_CODE="$((COUNT+3000))"

          # tag：release 用干净版本号；alpha/beta 带通道 + 运行号保证唯一
          if [ "$CHANNEL" = "release" ]; then
            TAG="v${VER_NAME}"
            PRE="false"
          else
            TAG="v${VER_NAME}-${CHANNEL}.${{ github.run_id }}"
            PRE="true"
          fi

          # 勾选输入 -> JSON 目标列表（boolean 在 github.event.inputs 中是 "true"/"false"）
          SEL=""
          [ "${{ github.event.inputs.build_windows_x64 }}" = "true" ] && SEL="$SEL windows-x64"
          [ "${{ github.event.inputs.build_linux_x64 }}" = "true" ] && SEL="$SEL linux-x64"
          [ "${{ github.event.inputs.build_linux_arm64 }}" = "true" ] && SEL="$SEL linux-arm64"
          [ "${{ github.event.inputs.build_macos_x64 }}" = "true" ] && SEL="$SEL macos-x64"
          [ "${{ github.event.inputs.build_macos_arm64 }}" = "true" ] && SEL="$SEL macos-arm64"

          INCLUDE="$(python3 - "$SEL" <<'PY'
          import json, sys
          mapping = {
              "windows-x64": ("windows-latest", "x86_64-pc-windows-msvc"),
              "linux-x64":   ("ubuntu-latest",  "x86_64-unknown-linux-gnu"),
              "linux-arm64": ("ubuntu-latest",  "aarch64-unknown-linux-gnu"),
              "macos-x64":   ("macos-13",       "x86_64-apple-darwin"),
              "macos-arm64": ("macos-14",       "aarch64-apple-darwin"),
          }
          sel = sys.argv[1].split()
          inc = [{"target": t, "os": mapping[t][0], "rust_target": mapping[t][1]} for t in sel if t in mapping]
          print(json.dumps(inc))
          PY
          )"
          if [ -z "$INCLUDE" ] || [ "$INCLUDE" = "[]" ]; then
            echo "::error::未选择任何构建目标"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "targets=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "bundle_jre=${{ github.event.inputs.bundle_jre }}" >> "$GITHUB_OUTPUT"
          echo "bundle_electron=${{ github.event.inputs.bundle_electron }}" >> "$GITHUB_OUTPUT"
          echo "手动发布: $CHANNEL $VER_NAME (code $VER_CODE, commits $COUNT) -> $TAG targets=$SEL jre=${{ github.event.inputs.bundle_jre }} electron=${{ github.event.inputs.bundle_electron }}"

          # 动态更新 workflow run 标题：Release x.y.z（版本号在 shell 内算出，
          # run-name 表达式拿不到，用 Actions API PATCH；失败不阻塞构建）
          curl -s -X PATCH "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"name\":\"Release ${VER_NAME}\"}" >/dev/null 2>&1 || true

  build:
    name: 构建 ${{ matrix.target }}
    needs: prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prep.outputs.targets) }}
    env:
      SUWAYOMI_VERSION_COUNT: ${{ needs.prep.outputs.count }}
      # 手动发布注入外部版本号 3.y.z（build.rs 优先用这个；Auto build 无此变量则用 r{code}）
      SUWAYOMI_VERSION_NAME: ${{ needs.prep.outputs.version_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装交叉编译工具链
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: 安装 JDK（扩展沙盒构建，windows 矩阵使用）
        # jvm-sandbox 的 gradle toolchain 统一 25（与发布捆绑的 JRE 25 一致）。
        # 仅 windows 矩阵需要。
        if: matrix.os == 'windows-latest'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: 构建
        # windows runner 默认 PowerShell——声明 bash 以统一语法、防止后续添加 bash 特有写法
        shell: bash
        run: |
          cargo build --release -p suwayomi-server --target ${{ matrix.rust_target }}
      - name: 打包
        id: pack
        shell: bash
        run: |
          VER="${{ needs.prep.outputs.version_name }}"
          CH="${{ needs.prep.outputs.channel }}"
          TGT="${{ matrix.target }}"
          BIN="target/${{ matrix.rust_target }}/release/suwayomi-server"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="${BIN}.exe"; fi

          IS_WIN="false"
          [ "${{ matrix.os }}" = "windows-latest" ] && IS_WIN="true"

          # ---- 基础 stage：桌面壳(win)、沙箱 jar(win)、oliphaunt runtime(win) 在此装配；
          #      JRE/Electron 不进基础包，作为可选 flavor 在最后复制加装 ----
          STAGE="dist/SuwayomiNext-${VER}-${CH}-${TGT}"
          mkdir -p "$STAGE/bin"
          cp "$BIN" "$STAGE/bin/"
          if [ "$IS_WIN" = "true" ]; then
            # 桌面壳（Tauri 托盘）——build-tray.sh 注入真实版本号到 Windows 资源
            bash tauri-app/build-tray.sh
            cp tauri-app/target/release/suwayomi.exe "$STAGE/" 2>/dev/null || true
            # 扩展沙盒（JVM，Kotlin fat jar）——放 bin/（server 自动查找）
            cd jvm-sandbox && ./gradlew -q jar --no-daemon && cd ..
            cp jvm-sandbox/build/libs/suwayomi-jvm-sandbox.jar "$STAGE/bin/jvm-sandbox.jar"
            # 捆绑 oliphaunt 原生 runtime（oliphaunt-build 编译期 staging 到
            # OUT_DIR/oliphaunt/resources——CI 构建的路径在用户机器不存在，
            # server 运行时回退到 exe 同级 oliphaunt-runtime/resources）
            RES=$(find target -path "*/release/build/suwayomi-core-*/out/oliphaunt/resources" -type d 2>/dev/null | head -1)
            if [ -n "$RES" ] && [ -d "$RES" ]; then
              mkdir -p "$STAGE/oliphaunt-runtime"
              cp -r "$RES" "$STAGE/oliphaunt-runtime/resources"
              echo "bundled oliphaunt runtime from $RES"
            else
              echo "WARN: no oliphaunt resources found to bundle"
            fi
          fi

          # ---- 解析 WebUI（fork latest release）的 .zip 下载地址。优先匿名 HTML 通道：
          #      releases.atom 拉最近 tag → 每个 tag 先试 expanded_assets、再试 release 页
          #      提取下载链接（无 API 限流、跨仓库无需 token；加 UA 减少 bot 页）。gh api
          #      与 curl API 仅兜底。所有探测命令都带 `|| true`，防止 GH runner 的
          #      `bash -e -o pipefail` 在探测失败（如跨仓库 GITHUB_TOKEN 404 → gh exit 4）
          #      时中止整个打包步。latest release 可能没有 .zip（历史无后缀产物），所以
          #      按 atom 顺序从新到旧扫描，命中第一个带 zip 的 release。----
          WEBUI_ZIP=""
          if [ -z "$WEBUI_ZIP" ]; then
            TAGS="$(curl -sL --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' "https://github.com/576576/Suwayomi-WebUI/releases.atom" | python3 -c "import re,sys,html; h=sys.stdin.read(); ts=[html.unescape(t).strip() for t in re.findall(r'releases/tag/([^/\"><]+)', h)]; u=[]; [u.append(t) for t in ts if t not in u]; print('\n'.join(u[:10]))")" || true
            for TAG in $TAGS; do
              PAGE="$(curl -sL --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' "https://github.com/576576/Suwayomi-WebUI/releases/expanded_assets/${TAG}")" || true
              WEBUI_ZIP="$(printf '%s' "$PAGE" | grep -oE '/576576/Suwayomi-WebUI/releases/download/[^"]*\.zip' | head -1 | sed 's|^|https://github.com|')" || true
              if [ -z "$WEBUI_ZIP" ]; then
                WEBUI_ZIP="$(curl -sL --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' "https://github.com/576576/Suwayomi-WebUI/releases/tag/${TAG}" | grep -oE '/576576/Suwayomi-WebUI/releases/download/[^"]*\.zip' | head -1 | sed 's|^|https://github.com|')" || true
              fi
              [ -n "$WEBUI_ZIP" ] && break
            done
          fi
          if [ -z "$WEBUI_ZIP" ] && command -v gh >/dev/null 2>&1; then
            WEBUI_ZIP="$(gh api repos/576576/Suwayomi-WebUI/releases/latest --jq '.assets[]? | select(.name|endswith(".zip")) | .browser_download_url' 2>/dev/null | head -1)" || true
          fi
          if [ -z "$WEBUI_ZIP" ]; then
            WEBUI_ZIP="$(curl -sL --retry 2 --max-time 30 "https://api.github.com/repos/576576/Suwayomi-WebUI/releases?per_page=10" | python3 -c "import json,sys; ds=json.load(sys.stdin); print(next((a[0] for d in ds if isinstance(d,dict) and (a:=[x['browser_download_url'] for x in d.get('assets',[]) if x['name'].endswith('.zip')])), ''))") 2>/dev/null" || true
          fi
          if [ -z "$WEBUI_ZIP" ]; then
            echo "::error::无法解析 576576/Suwayomi-WebUI 的 .zip release 资产（atom/gh/API 均无结果）"
            exit 1
          fi
          echo "webui zip: $WEBUI_ZIP"
          curl -sL -o webui.zip "$WEBUI_ZIP"
          mkdir -p "$STAGE/webui"
          python3 -c "import zipfile; zipfile.ZipFile('webui.zip').extractall('$STAGE/webui')"
          # 记录部署的 WebUI 版本（server aboutWebUI/checkForWebUIUpdate 读取）
          echo "$WEBUI_ZIP" | python3 -c "import sys; u=sys.stdin.read().strip(); print(u.split('/download/')[1].split('/')[0])" > "$STAGE/webui/revision"
          rm -f webui.zip
          mkdir -p "$STAGE/data/autobackup" "$STAGE/data/downloads" "$STAGE/data/local"

          zip_dir() {
            # $1=stage 目录（去掉 dist/ 前缀的展示名）$2=zip 绝对路径
            powershell -Command "Compress-Archive -Path '$1' -DestinationPath '$2' -Force"
          }

          ARTIFACTS=""
          if [ "$IS_WIN" = "false" ]; then
            # linux/macOS：仅 server 基础包（可选捆绑仅 Windows 提供）
            tar -C dist -czf "dist/SuwayomiNext-${VER}-${CH}-${TGT}.tar.gz" "SuwayomiNext-${VER}-${CH}-${TGT}"
            ARTIFACTS="dist/SuwayomiNext-${VER}-${CH}-${TGT}.tar.gz"
          else
            # ---- Windows：基础包（无后缀，两个都不捆绑）----
            zip_dir "dist/SuwayomiNext-${VER}-${CH}-${TGT}" "dist/SuwayomiNext-${VER}-${CH}-${TGT}.zip"
            ARTIFACTS="dist/SuwayomiNext-${VER}-${CH}-${TGT}.zip"

            JRE="${{ needs.prep.outputs.bundle_jre }}"
            EL="${{ needs.prep.outputs.bundle_electron }}"

            # 预下载运行时到 bundle-tmp，供各 flavor 复用（避免重复下载）
            mkdir -p bundle-tmp
            JRE_DIR=""
            if [ "$JRE" = "true" ]; then
              curl -sL -o temurin-jre.zip "https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jre/hotspot/normal/eclipse"
              python3 -c "import os,zipfile; z=zipfile.ZipFile('temurin-jre.zip'); t=z.namelist()[0].split('/')[0]; z.extractall('bundle-tmp/jre-x'); os.rename('bundle-tmp/jre-x/'+t,'bundle-tmp/jre'); z.close()"
              rm -rf bundle-tmp/jre-x temurin-jre.zip
              JRE_DIR="bundle-tmp/jre"
            fi
            EL_DIR=""
            if [ "$EL" = "true" ]; then
              ELECTRON_VER="v44.1.0"
              curl -sL -o electron.zip "https://github.com/electron/electron/releases/download/${ELECTRON_VER}/electron-${ELECTRON_VER}-win32-x64.zip"
              mkdir -p bundle-tmp/electron
              python3 -c "import zipfile; zipfile.ZipFile('electron.zip').extractall('bundle-tmp/electron')"
              rm -f electron.zip
              # 应用入口 + 窗口图标（与 main.js 的 BrowserWindow icon 配套）
              mkdir -p bundle-tmp/electron/resources/app
              cp electron-app/main.js electron-app/package.json bundle-tmp/electron/resources/app/
              cp tauri-app/icons/icon.ico bundle-tmp/electron/resources/app/icon.ico
              EL_DIR="bundle-tmp/electron"
            fi

            # ---- 可选捆绑：+jre（base + Temurin JRE 25 jre/）----
            if [ -n "$JRE_DIR" ]; then
              ST="dist/SuwayomiNext-${VER}-${CH}-${TGT}+jre"
              cp -r "$STAGE" "$ST"
              cp -r "$JRE_DIR" "$ST/jre"
              zip_dir "$ST" "${ST}.zip"
              ARTIFACTS+=$'\n'"${ST}.zip"
            fi

            # ---- 可选捆绑：+electron（base + Electron 运行时；JRE 开启时一并继承，
            #      命名 +electron+jre 以如实标注内容）----
            if [ -n "$EL_DIR" ]; then
              if [ -n "$JRE_DIR" ]; then
                ST="dist/SuwayomiNext-${VER}-${CH}-${TGT}+electron+jre"
              else
                ST="dist/SuwayomiNext-${VER}-${CH}-${TGT}+electron"
              fi
              cp -r "$STAGE" "$ST"
              if [ -n "$JRE_DIR" ]; then cp -r "$JRE_DIR" "$ST/jre"; fi
              cp -r "$EL_DIR" "$ST/electron"
              zip_dir "$ST" "${ST}.zip"
              ARTIFACTS+=$'\n'"${ST}.zip"
            fi
            rm -rf bundle-tmp
          fi

          # GITHUB_OUTPUT 多行值必须用 name<<DELIM 定界格式（普通 name=value 遇换行即报
          # Invalid format），artifacts 是每行一个产物路径的列表
          {
            echo "artifacts<<ARTIFACTS_EOF"
            printf '%s\n' "$ARTIFACTS"
            echo "ARTIFACTS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "packed artifacts:"
          echo "$ARTIFACTS" | sed 's/^/  /'
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: SuwayomiNext-${{ needs.prep.outputs.version_name }}-${{ needs.prep.outputs.channel }}-${{ matrix.target }}
          path: ${{ steps.pack.outputs.artifacts }}

  publish:
    name: 发布 ${{ needs.prep.outputs.channel }} (${{ needs.prep.outputs.version_name }})
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes 需要 git 仓库——publish job 必须
      # 先 checkout（fetch-depth: 0 拿完整历史生成 changelog）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
          VER: ${{ needs.prep.outputs.version_name }}
          CH: ${{ needs.prep.outputs.channel }}
          CODE: ${{ needs.prep.outputs.version_code }}
          COUNT: ${{ needs.prep.outputs.count }}
          PRE: ${{ needs.prep.outputs.prerelease }}
          JRE: ${{ needs.prep.outputs.bundle_jre }}
          EL: ${{ needs.prep.outputs.bundle_electron }}
        run: |
          # release 通道的 tag 可能已存在（同版本重复发布）——先删除旧 tag/release
          if [ "$CH" = "release" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            artifacts/* \
            --title "SuwayomiNext $VER ($CH)" \
            --notes "## SuwayomiNext $VER · $CH
          - versionName: $VER
          - versionCode: $CODE
          - commits: $COUNT
          - channel: $CH（手动触发）
          - 产物命名：无后缀=基础包（不含 JRE/Electron）；Windows x64 可选 \`+jre\`（捆绑 Temurin JRE 25）与 \`+electron\`(\`+electron+jre\`)（捆绑 Electron 桌面壳）；本次 jre=$JRE electron=$EL" \
            --prerelease="$PRE" \
            --generate-notes
