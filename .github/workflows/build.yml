name: Build

# 可复用构建工作流（workflow_call）：所有 target 的编译 + 打包都在这里完成。
# 调用方 release.yml 负责算版本号、解析 WebUI 制品、创建 Release；本文件只负责把包做出来。
#
# pack_mode 对应合并前两个 workflow 各自的产物约定：
#   channel —— 手动发布：默认包（不打包 JRE）必然产出；pack_jre 勾上时另出 `+jre`
#              （在默认包内容之上追加裁剪后的 JRE）。
#   alpha   —— 推送自动构建：只出 +jre 一份（Windows/Linux 都捆 JRE），不出基线包
#              —— 与旧 Auto build 的产物集逐字一致。
# 产物名统一是 Suwayomi-{VER}{通道段}-{TGT}[+jre]；通道段只有 beta 非空（beta 与
# release 共用 3.y.z 版本名，不区分就会重名），取值由调用方算好从 channel_suffix 传入。
# Android 由独立的 android job 构建（arm64 / x64 各一份 APK），**不参与** +jre 这组选项。
# OCI 镜像由独立的 oci job 构建（linux/amd64 + linux/arm64 各在原生 runner 上），
# 推送到 GHCR 后用 imagetools 合成多架构 manifest —— 不进 Release 附件。
# 通道语义 / 版本规则 / 捆绑细节见 docs/release.md。

on:
  workflow_call:
    inputs:
      channel:
        description: alpha / beta / release —— 写入编译期 SUWAYOMI_BUILD_TYPE
        required: true
        type: string
      channel_suffix:
        description: 产物名与镜像标签里的通道段（仅 beta 为 -beta，其余通道为空串）
        required: true
        type: string
      pack_mode:
        description: channel = 手动发布产物约定；alpha = 自动构建产物约定
        required: true
        type: string
      version_name:
        description: 版本名（release/beta 为 3.y.z，alpha 为 r{code}）
        required: true
        type: string
      count:
        description: 提交数（versionCode = count + 3000，由 build.rs 推导）
        required: true
        type: string
      webui_url:
        description: 捆绑的 WebUI zip 下载地址（调用方解析一次，所有 target 复用同一份）
        required: true
        type: string
      ext_runtime_url:
        description: 捆绑的 ext-runtime.jar 下载地址（Suwayomi-ext-runtime 的 Release 资产，免鉴权；调用方解析一次，所有 target 复用同一份）
        required: true
        type: string
      ext_runtime_version:
        description: 捆绑的 ext-runtime 版本号，用于编译期标记、日志与拼 JRE 资产名
        required: true
        type: string
      ext_runtime_jre_base:
        description: ext-runtime 该版本 Release 的资产下载前缀（裁剪 JRE 按 <base>/ext-runtime-jre-<V>-<os>-<arch>.tar.gz 取）
        required: true
        type: string
      targets:
        description: 桌面/服务端构建矩阵 include 数组（JSON 字符串，不含 Android；可为空数组）
        required: true
        type: string
      pack_jre:
        description: 是否额外产出 +jre 包（在默认包内容之上追加对应架构的裁剪 JRE；裁剪在 Suwayomi-ext-runtime 做，这里只下载资产）
        required: false
        type: boolean
        default: false
      android_targets:
        description: Android 构建矩阵 include 数组（JSON 字符串，元素含 target/abi/rust_target；可为空数组）
        required: true
        type: string
      pack_oci:
        description: 是否额外构建 OCI 镜像并推送到 GHCR（linux/amd64 与 linux/arm64 多架构）
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    # targets 可以是空数组（只勾了 Android 时）——矩阵为空会让 Actions 直接报错，
    # 所以显式跳过。
    if: inputs.targets != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}
    env:
      CARGO_TERM_COLOR: always
      SUWAYOMI_VERSION_COUNT: ${{ inputs.count }}
      # 合并前的自动构建（alpha）不传 VERSION_NAME，由 build.rs 回退到 r{versionCode}；
      # 此处两种模式统一传入，值与回退结果完全一致（调用方算出的 alpha 版本名即 r{count+3000}）。
      SUWAYOMI_VERSION_NAME: ${{ inputs.version_name }}
      SUWAYOMI_BUILD_TYPE: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装交叉编译工具链
        # 只有"在 x86_64 runner 上出 aarch64 包"才需要交叉工具链。linux-arm64 现在
        # 跑在原生 arm64 runner 上（见 release.yml 的 target mapping）——JRE 资产是按
        # (os, arch) 分开发布的，+jre 取哪一份由矩阵决定，与 runner 是否同架构无关。
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu' && runner.arch == 'X64'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: 安装桌面壳系统依赖（Linux）
        # 托盘壳（Tauri）在所有 Linux target 上都要（webkit2gtk + appindicator）；
        # ubuntu-24.04-arm 的 arm64 源里有同名包，所以两个架构共用同一条命令。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      # 这一步以前装 JDK 给 +jre 的 jlink 用，现在不需要了：ext-runtime.jar 与裁剪好的
      # JRE 都从 Suwayomi-ext-runtime 的 Release 资产下载，本仓库不再跑任何 JVM 工具链。
      - name: 构建
        shell: bash
        run: |
          cargo build --release -p suwayomi-server --target ${{ matrix.rust_target }}
      - name: 打包
        id: pack
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"
          MODE="${{ inputs.pack_mode }}"
          BIN="target/${{ matrix.rust_target }}/release/suwayomi-server"
          # 判平台一律用 runner.os，不要拿 matrix.os 的 runner 标签去比字面量 ——
          # Windows 的 runner 标签不止 windows-latest 一个（还有 windows-11-arm），
          # 按标签比会让新架构悄悄走错分支（.exe 后缀、zip 打包都会错）。
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi

          IS_WIN="false"
          [ "${{ runner.os }}" = "Windows" ] && IS_WIN="true"

          # 产物基名（两套 pack_mode 约定见文件头）：通道段由调用方给出，通常为空 ——
          # 只有 beta 带（与 release 同名 3.y.z，不区分就会重名）。
          BASE="Suwayomi-${VER}${{ inputs.channel_suffix }}-${TGT}"

          # 暂存目录本身就是「默认包」（不打包 JRE 的那份，必然产出）；
          # +jre 包在它基础上复制一份再追加 JRE，避免重复下载 WebUI、重复 gradle。
          STAGE="dist/${BASE}"
          rm -rf "$STAGE" "dist/${BASE}+jre"
          mkdir -p "$STAGE/bin"
          cp "$BIN" "$STAGE/bin/"

          # 桌面壳（Tauri 托盘）：**所有**桌面 target 都出（Windows / Linux x64+arm64 /
          # macOS x64+arm64）。Android 不在此矩阵里，它由独立的 android job 出 APK。
          # 三个平台都是原生 runner 编译，tray 有自己的 workspace 与 target 目录。
          bash suwayomi-tray/build-tray.sh
          cp suwayomi-tray/target/release/suwayomi "$STAGE/" 2>/dev/null \
            || cp suwayomi-tray/target/release/suwayomi.exe "$STAGE/" 2>/dev/null \
            || echo "WARN: desktop shell binary not found"

          # 扩展沙盒 jar 进 bin/（server 自动查找）。ext-runtime 是纯 JVM 字节码，
          # 所有 target 用同一份制品 —— 直接下载，不再逐 target 跑 gradle。
          #   -f 必须加：GitHub 对失败请求返回 HTML/JSON，不加 -f 会把响应体当 jar 存下来，
          #   要到运行时才发现（见 docs/release.md）。
          curl -fsSL -o "$STAGE/bin/ext-runtime.jar" "${{ inputs.ext_runtime_url }}"
          # 落地校验：能列出主类才算真的 jar（只看文件非空会漏掉「下到了错误页」）
          unzip -l "$STAGE/bin/ext-runtime.jar" | grep -q 'sandbox/MainKt.class' \
            || { echo "::error::ext-runtime.jar 内容异常（缺 sandbox/MainKt.class）"; exit 1; }
          echo "ext-runtime ${{ inputs.ext_runtime_version }} → $STAGE/bin/ext-runtime.jar"
          # WebUI：调用方已按通道解析好，所有 target 用同一份
          curl -sL -o webui.zip "${{ inputs.webui_url }}"
          mkdir -p "$STAGE/webui"
          python3 -c "import zipfile; zipfile.ZipFile('webui.zip').extractall('$STAGE/webui')"
          rm -f webui.zip
          mkdir -p "$STAGE/data/autobackup" "$STAGE/data/downloads" "$STAGE/data/local"

          zip_dir() {
            powershell -Command "Compress-Archive -Path '$1' -DestinationPath '$2' -Force"
          }

          # 压包：Windows 出 zip，其余出 tar.gz。结果放 $ARCHIVE。
          ARCHIVE=""
          pack_dir() {
            local dir="$1"
            if [ "$IS_WIN" = "true" ]; then
              zip_dir "$dir" "${dir}.zip"
              ARCHIVE="${dir}.zip"
            else
              tar -C dist -czf "${dir}.tar.gz" "$(basename "$dir")"
              ARCHIVE="${dir}.tar.gz"
            fi
          }

          ARTIFACTS=""
          # alpha（推送自动构建）与旧 Auto build 的产物集一致：只出 +jre 一份。
          # channel（手动发布）出基线包 —— 它就是「必然产出」的那份，没有开关。
          BASE_PACK="true"
          [ "$MODE" = "alpha" ] && BASE_PACK="false"
          if [ "$BASE_PACK" = "true" ]; then
            pack_dir "$STAGE"
            ARTIFACTS="$ARCHIVE"
          fi
          if [ "${{ inputs.pack_jre }}" = "true" ]; then
            JRE_DIR="dist/${BASE}+jre"
            cp -r "$STAGE" "$JRE_DIR"
            # 裁剪好的 JRE 是 Suwayomi-ext-runtime 的发布资产 —— 那边才跑 jlink，因为
            # 模块白名单完全由沙盒需求决定（jdk.httpserver 是沙盒的 HTTP 宿主、
            # java.prefs 是共享源码的 PersistentCookieStore）。这里只按
            # <V>+<os>+<arch> 取回来解开，不再本地构建。
            JRE_ASSET="ext-runtime-jre-${{ inputs.ext_runtime_version }}-${{ matrix.jre_os }}-${{ matrix.jre_arch }}.tar.gz"
            curl -fsSL --retry 3 -o "$JRE_ASSET" "${{ inputs.ext_runtime_jre_base }}/$JRE_ASSET"
            tar -xzf "$JRE_ASSET" -C "$JRE_DIR"
            rm -f "$JRE_ASSET"
            # 解出来的必须真是**本平台**的运行时：jlink 不能跨平台，取错资产是
            # 「Windows 上放了个 ELF」这种，只在装上运行时才炸。跑一次最直接。
            if [ "${{ matrix.jre_os }}" = "windows" ]; then
              JAVA_BIN="$JRE_DIR/jre/bin/java.exe"
            else
              JAVA_BIN="$JRE_DIR/jre/bin/java"
            fi
            test -f "$JAVA_BIN" || { echo "::error::JRE 资产内容异常（缺 $JAVA_BIN）"; exit 1; }
            "$JAVA_BIN" -version
            pack_dir "$JRE_DIR"
            ARTIFACTS="${ARTIFACTS:+$ARTIFACTS$'\n'}$ARCHIVE"
          fi
          rm -rf "$STAGE"

          # 兜底：alpha 模式又没勾 +jre（正常不会发生，release.yml 硬编码 jre=true）
          if [ -z "$ARTIFACTS" ]; then
            echo "::error::没有任何产物可出（pack_mode=$MODE jre=${{ inputs.pack_jre }}）"
            exit 1
          fi

          {
            echo "artifacts<<ARTIFACTS_EOF"
            printf '%s\n' "$ARTIFACTS"
            echo "ARTIFACTS_EOF"
            echo "artifact_name=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "packed artifacts:"
          echo "$ARTIFACTS" | sed 's/^/  /'
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}

  android:
    name: 构建 ${{ matrix.target }}
    # 与桌面矩阵同一套写法：include 由调用方按勾选拼好，空数组时整个 job 跳过。
    if: inputs.android_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.android_targets) }}
    env:
      CARGO_TERM_COLOR: always
      SUWAYOMI_VERSION_COUNT: ${{ inputs.count }}
      SUWAYOMI_VERSION_NAME: ${{ inputs.version_name }}
      SUWAYOMI_BUILD_TYPE: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装 JDK
        # Gradle 9 需要 ≥ 17；与另外几处保持同一个 25，避免"本地能跑、CI 不能"。
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: 安装 Android SDK 组件
        # ubuntu runner 预装了 Android SDK（含 cmdline-tools），但 compileSdk 37 与
        # NDK 28.2 都不在预装列表里，按需补装。NDK 版本显式钉住并导出 ANDROID_NDK_HOME：
        # android/scripts/build-rust.sh 会优先用它，避免悄悄选中 runner 上的新版本。
        #
        # 平台包名是 **android-37.0**，不是 android-37 —— API 36.1 起 Google 改用
        # "次版本号"命名（36.1 / 37.0 / 37.1 / 37.2 各自是独立包，而裸 android-37
        # 不存在）。写成 android-37 会在这一步直接
        # `Warning: Failed to find package 'platforms;android-37'` 退出 1。
        # 三者都在稳定通道（channel-0），不需要 --channel。
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "ndk;28.2.13676358"
      - name: 交叉编译 Rust server（cdylib）
        # 产出 android/app/src/main/jniLibs/<abi>/libsuwayomi_android.so；
        # ABI 由矩阵给出（arm64 → arm64-v8a，x86_64 → x86_64，见 build-rust.sh 的映射）
        run: ABI=${{ matrix.abi }} bash android/scripts/build-rust.sh
      - name: 打包 WebUI 进 assets
        run: |
          curl -sL -o webui.zip "${{ inputs.webui_url }}"
          bash android/scripts/package-webui.sh webui.zip
      - name: 准备 release 签名（可选）
        # 没配 secret 就用 AGP 的 debug key 签名并给出警告 —— 自用分发里"能装上"
        # 比"签名好看"重要。注意临时 debug key 每次 CI 都不同：跨次覆盖安装前
        # 要先卸载。要稳定签名就配这组 secret。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/keystore.jks
            {
              echo "SUWAYOMI_KEYSTORE=keystore.jks"
              echo "SUWAYOMI_KEYSTORE_PASSWORD=$KS_PASS"
              echo "SUWAYOMI_KEY_ALIAS=${KEY_ALIAS:-suwayomi}"
              echo "SUWAYOMI_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "已注入 release keystore"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，APK 将用临时 debug key 签名（跨次安装需先卸载）"
          fi
      - name: 取 ext-runtime 共享源码
        # 桌面侧要的是编好的 jar，Android 侧只能吃源码（AGP 内置 Kotlin 2.3.20
        # 读不了 ext-runtime 的 Kotlin 2.4.0 元数据），所以这里拿的是同一个 release
        # 里的 -shared-sources 资产。同样是 Release 资产，同样免鉴权。
        run: bash android/scripts/fetch-ext-runtime-src.sh "${{ inputs.ext_runtime_version }}"
      - name: Gradle 构建 APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: 打包产物
        id: pack
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"

          # 与桌面产物同一套命名约定（见文件头）：通道段只有 beta 非空。
          # Android 不打包 JRE，所以没有 +jre 形态后缀。
          NAME="Suwayomi-${VER}${{ inputs.channel_suffix }}-${TGT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "::error::找不到 $APK"; ls -R android/app/build/outputs/apk 2>/dev/null; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/${NAME}.apk"

          {
            echo "artifacts=dist/${NAME}.apk"
            echo "artifact_name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "packed: dist/${NAME}.apk ($(du -h "dist/${NAME}.apk" | cut -f1))"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}

  # ---------------------------------------------------------------------------
  # OCI 镜像（docker）。与桌面矩阵完全独立：自己从源码编 server，沙盒 jar 与裁剪 JRE
  # 都从 Suwayomi-ext-runtime 的 Release 资产下载。内容与桌面包基本一致，但**不含托盘壳**
  # —— 容器里没有 GUI，也没有 webkit2gtk/appindicator，装进去只会是个跑不起来的死文件。
  # 产物只推 GHCR，不进 Release 附件（镜像的版本由 tag 表达，塞一个 docker-save
  # 出来的大归档没有意义）。
  #
  # 两个架构各跑**同架构**的 runner：JRE 资产是按架构分的（见 docs/release.md），
  # 所以 arm64 用 ubuntu-24.04-arm 原生构建。各推一个 -amd64 / -arm64 标签，再由
  # oci_manifest 合成多架构 manifest —— 否则得用 QEMU 模拟编译 arm64，慢一个数量级。
  oci:
    name: 构建 OCI ${{ matrix.arch }}
    if: inputs.pack_oci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest,    platform: linux/amd64 }
          - { arch: arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7
      - name: 解析镜像标签
        id: meta
        # 标签与产物名同一套规则：只有 beta 带通道段（beta 与 release 共用 3.y.z）。
        # GHCR 只接受小写仓库名，所以这里显式转小写。
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ inputs.version_name }}${{ inputs.channel_suffix }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "镜像：${IMAGE}:${TAG}-${{ matrix.arch }}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          # 先只 load 到本地 daemon（不 push）：冒烟通过后才在下一步推上去
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            WEBUI_URL=${{ inputs.webui_url }}
            EXT_RUNTIME_VERSION=${{ inputs.ext_runtime_version }}
            VERSION_NAME=${{ inputs.version_name }}
            VERSION_COUNT=${{ inputs.count }}
            BUILD_TYPE=${{ inputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version_name }}
          cache-from: type=gha,scope=oci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=oci-${{ matrix.arch }}
          # 关掉 provenance：多架构 manifest 由 imagetools 合成，混进 attestation 会让
          # index 里多出平台未知的条目（docker pull 时反而更难读）
          provenance: false
      - name: 冒烟测试镜像
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMG="${IMAGE}:${TAG}-${ARCH}"
          # 1) 静态：二进制能跑（Linux server 走 openssl，缺 libssl 会直接起不来）、
          #    下载来的 JRE 与基础镜像的 glibc 兼容、捆绑的三件套都在
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            /opt/suwayomi/bin/suwayomi-server --version
            /opt/suwayomi/jre/bin/java -version
            test -f /opt/suwayomi/webui/index.html
            test -f /opt/suwayomi/bin/ext-runtime.jar
            if ldd /opt/suwayomi/bin/suwayomi-server | grep -q "not found"; then
              echo "缺少动态库："
              ldd /opt/suwayomi/bin/suwayomi-server | grep "not found"
              exit 1
            fi
          '
          # 2) 动态：真起一个容器，等到 HTTP 有响应为止（顺带验证端口绑定与 webui 目录解析）
          docker run -d --name oci-smoke -p 18090:8090 "$IMG"
          code="000"
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/ || true)"
            [ "$code" != "000" ] && break
            sleep 2
          done
          docker logs oci-smoke 2>&1 | tail -30 || true
          docker rm -f oci-smoke >/dev/null 2>&1 || true
          [ "$code" != "000" ] || { echo "::error::容器 60 秒内没有任何 HTTP 响应"; exit 1; }
          echo "容器响应 HTTP $code"
      - name: 推送镜像
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: docker push "${IMAGE}:${TAG}-${ARCH}"

  oci_manifest:
    name: 合成 OCI 多架构 manifest
    if: inputs.pack_oci
    needs: oci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: imagetools create
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.version_name }}${{ inputs.channel_suffix }}
        run: |
          IMAGE="${IMAGE,,}"
          # 两个单架构标签都在（上面的 push 步骤成功过）才合成，缺一个就明确失败
          docker buildx imagetools inspect "${IMAGE}:${TAG}-amd64" >/dev/null
          docker buildx imagetools inspect "${IMAGE}:${TAG}-arm64" >/dev/null
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
