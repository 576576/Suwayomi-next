name: Release

# 手动发布 CI（channel + 目标复选）。自动 alpha 走 release-alpha.yml。
# 通道语义/版本规则/产物命名/WebUI 分流等背景见 docs/release.md。

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道（alpha/beta/release）
        type: choice
        options: [alpha, beta, release]
        default: release
      build_windows_x64:
        description: Windows x64
        type: boolean
        default: true
      build_linux_x64:
        description: Linux x64
        type: boolean
        default: true
      build_linux_arm64:
        description: Linux arm64（仅 server，无桌面壳）
        type: boolean
        default: false
      build_macos_x64:
        description: macOS x64
        type: boolean
        default: false
      build_macos_arm64:
        description: macOS arm64
        type: boolean
        default: false
      bundle_jre:
        description: Windows 额外产物 +jre（捆绑 Temurin JRE 25，扩展沙盒自包含）
        type: boolean
        default: true
      version_count:
        description: 版本计数（留空用提交数；预发布验证用）
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    name: 准备构建参数
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      channel: ${{ steps.out.outputs.channel }}
      targets: ${{ steps.out.outputs.targets }}
      version_name: ${{ steps.out.outputs.version_name }}
      version_code: ${{ steps.out.outputs.version_code }}
      count: ${{ steps.out.outputs.count }}
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
      bundle_jre: ${{ steps.out.outputs.bundle_jre }}
      # WebUI 制品在 prep 解析一次、所有 target 复用（避免各架构拉到不同构建）
      webui_url: ${{ steps.webui.outputs.url }}
      webui_tag: ${{ steps.webui.outputs.tag }}
      webui_kind: ${{ steps.webui.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: out
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"

          COUNT="${{ github.event.inputs.version_count }}"
          if [ -z "$COUNT" ]; then COUNT="$(git rev-list --count HEAD)"; fi

          VER_CODE="$((COUNT+3000))"

          # alpha 用 r{code}；beta/release 用外部 3.y.z（规则见 docs/release.md）
          if [ "$CHANNEL" = "alpha" ]; then
            VER_NAME="r${VER_CODE}"
          else
            VER_NAME="3.$((COUNT/100)).$(printf '%02d' $((COUNT%100)))"
          fi

          case "$CHANNEL" in
            release) TAG="v${VER_NAME}";                          PRE="false" ;;
            beta)    TAG="v${VER_NAME}-beta.${{ github.run_id }}"; PRE="false" ;;
            alpha)   TAG="${VER_NAME}-alpha.${{ github.run_id }}"; PRE="true" ;;
            *)       echo "::error::未知通道 $CHANNEL"; exit 1 ;;
          esac

          SEL=""
          [ "${{ github.event.inputs.build_windows_x64 }}" = "true" ] && SEL="$SEL windows-x64"
          [ "${{ github.event.inputs.build_linux_x64 }}" = "true" ] && SEL="$SEL linux-x64"
          [ "${{ github.event.inputs.build_linux_arm64 }}" = "true" ] && SEL="$SEL linux-arm64"
          [ "${{ github.event.inputs.build_macos_x64 }}" = "true" ] && SEL="$SEL macos-x64"
          [ "${{ github.event.inputs.build_macos_arm64 }}" = "true" ] && SEL="$SEL macos-arm64"

          INCLUDE="$(python3 - "$SEL" <<'PY'
          import json, sys
          mapping = {
              "windows-x64": ("windows-latest", "x86_64-pc-windows-msvc"),
              "linux-x64":   ("ubuntu-latest",  "x86_64-unknown-linux-gnu"),
              "linux-arm64": ("ubuntu-latest",  "aarch64-unknown-linux-gnu"),
              "macos-x64":   ("macos-13",       "x86_64-apple-darwin"),
              "macos-arm64": ("macos-14",       "aarch64-apple-darwin"),
          }
          sel = sys.argv[1].split()
          inc = [{"target": t, "os": mapping[t][0], "rust_target": mapping[t][1]} for t in sel if t in mapping]
          print(json.dumps(inc))
          PY
          )"
          if [ -z "$INCLUDE" ] || [ "$INCLUDE" = "[]" ]; then
            echo "::error::未选择任何构建目标"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "targets=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "bundle_jre=${{ github.event.inputs.bundle_jre }}" >> "$GITHUB_OUTPUT"
          echo "手动发布: $CHANNEL $VER_NAME (code $VER_CODE, commits $COUNT) -> $TAG targets=$SEL jre=${{ github.event.inputs.bundle_jre }}"

          # 动态更新 workflow run 标题（版本号在 shell 内算出，run-name 拿不到）；失败不阻塞
          curl -s -X PATCH "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"name\":\"Release ${VER_NAME}\"}" >/dev/null 2>&1 || true

      - name: 解析捆绑的 WebUI 制品
        id: webui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event.inputs.channel }}" in
            release) KIND="stable" ;;
            *)       KIND="build"  ;;
          esac
          ZIP="$(bash scripts/resolve-webui.sh "$KIND")"
          TAG="${ZIP#*/download/}"
          TAG="${TAG%%/*}"
          echo "url=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "捆绑 WebUI: $TAG（kind=$KIND）"

  build:
    name: 构建 ${{ matrix.target }}
    needs: prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prep.outputs.targets) }}
    env:
      SUWAYOMI_VERSION_COUNT: ${{ needs.prep.outputs.count }}
      SUWAYOMI_VERSION_NAME: ${{ needs.prep.outputs.version_name }}
      SUWAYOMI_BUILD_TYPE: ${{ needs.prep.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装交叉编译工具链
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: 安装桌面壳系统依赖（Linux）
        # 仅 linux-x64 需桌面壳（webkit2gtk + appindicator）；aarch64 只发 server
        if: matrix.rust_target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: 安装 JDK
        # 构建 bin/jvm-sandbox.jar（gradle toolchain 25 与捆绑 JRE 一致）
        if: matrix.os == 'windows-latest' || matrix.rust_target == 'x86_64-unknown-linux-gnu'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: 构建
        shell: bash
        run: |
          cargo build --release -p suwayomi-server --target ${{ matrix.rust_target }}
      - name: 打包
        id: pack
        shell: bash
        run: |
          VER="${{ needs.prep.outputs.version_name }}"
          CH="${{ needs.prep.outputs.channel }}"
          TGT="${{ matrix.target }}"
          BIN="target/${{ matrix.rust_target }}/release/suwayomi-server"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="${BIN}.exe"; fi

          IS_WIN="false"
          [ "${{ matrix.os }}" = "windows-latest" ] && IS_WIN="true"

          # 桌面壳（Tauri 托盘）：Windows 全支持；Linux 仅 x86_64 原生构建
          DESKTOP_SHELL="false"
          if [ "$IS_WIN" = "true" ] || [ "${{ matrix.rust_target }}" = "x86_64-unknown-linux-gnu" ]; then
            DESKTOP_SHELL="true"
          else
            echo "WARN: ${{ matrix.rust_target }} 不提供桌面壳（仅 Windows 与 linux-x64），只发 server"
          fi

          STAGE="dist/Suwayomi-${VER}-${CH}-${TGT}"
          mkdir -p "$STAGE/bin"
          cp "$BIN" "$STAGE/bin/"
          if [ "$DESKTOP_SHELL" = "true" ]; then
            bash suwayomi-tray/build-tray.sh
            cp suwayomi-tray/target/release/suwayomi "$STAGE/" 2>/dev/null \
              || cp suwayomi-tray/target/release/suwayomi.exe "$STAGE/" 2>/dev/null \
              || echo "WARN: desktop shell binary not found"
          fi
          if [ "$DESKTOP_SHELL" = "true" ]; then
            # 扩展沙盒 jar 进 bin/（server 自动查找）；跨平台字节码，win/linux-x64 共用
            cd jvm-sandbox && ./gradlew -q jar --no-daemon && cd ..
            cp jvm-sandbox/build/libs/suwayomi-jvm-sandbox.jar "$STAGE/bin/jvm-sandbox.jar"
          fi
          # oliphaunt 原生 runtime（全平台捆绑；编译期 OUT_DIR 仅 runner 存在，运行时回退 exe 上级 bundled 目录）
          RES=$(find target -path "*/release/build/suwayomi-core-*/out/oliphaunt/resources" -type d 2>/dev/null | head -1)
          if [ -n "$RES" ] && [ -d "$RES" ]; then
            mkdir -p "$STAGE/oliphaunt-runtime"
            cp -r "$RES" "$STAGE/oliphaunt-runtime/resources"
            echo "bundled oliphaunt runtime from $RES"
          else
            echo "WARN: no oliphaunt resources found to bundle"
          fi

          # WebUI：prep 已按通道解析好，所有 target 用同一份
          curl -sL -o webui.zip "${{ needs.prep.outputs.webui_url }}"
          mkdir -p "$STAGE/webui"
          python3 -c "import zipfile; zipfile.ZipFile('webui.zip').extractall('$STAGE/webui')"
          rm -f webui.zip
          mkdir -p "$STAGE/data/autobackup" "$STAGE/data/downloads" "$STAGE/data/local"

          zip_dir() {
            powershell -Command "Compress-Archive -Path '$1' -DestinationPath '$2' -Force"
          }

          ARTIFACTS=""
          if [ "$IS_WIN" = "false" ]; then
            tar -C dist -czf "dist/Suwayomi-${VER}-${CH}-${TGT}.tar.gz" "Suwayomi-${VER}-${CH}-${TGT}"
            ARTIFACTS="dist/Suwayomi-${VER}-${CH}-${TGT}.tar.gz"
          else
            zip_dir "dist/Suwayomi-${VER}-${CH}-${TGT}" "dist/Suwayomi-${VER}-${CH}-${TGT}.zip"
            ARTIFACTS="dist/Suwayomi-${VER}-${CH}-${TGT}.zip"

            # 可选 +jre：基础包 + Temurin JRE 25 jre/
            if [ "${{ needs.prep.outputs.bundle_jre }}" = "true" ]; then
              curl -sL -o temurin-jre.zip "https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jre/hotspot/normal/eclipse"
              python3 -c "import os,zipfile; z=zipfile.ZipFile('temurin-jre.zip'); t=z.namelist()[0].split('/')[0]; z.extractall('jre-x'); os.rename('jre-x/'+t,'jre'); z.close()"
              rm -rf jre-x temurin-jre.zip
              ST="dist/Suwayomi-${VER}-${CH}-${TGT}+jre"
              cp -r "$STAGE" "$ST"
              cp -r jre "$ST/jre"
              zip_dir "$ST" "${ST}.zip"
              ARTIFACTS+=$'\n'"${ST}.zip"
              rm -rf jre
            fi
          fi

          {
            echo "artifacts<<ARTIFACTS_EOF"
            printf '%s\n' "$ARTIFACTS"
            echo "ARTIFACTS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "packed artifacts:"
          echo "$ARTIFACTS" | sed 's/^/  /'
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Suwayomi-${{ needs.prep.outputs.version_name }}-${{ needs.prep.outputs.channel }}-${{ matrix.target }}
          path: ${{ steps.pack.outputs.artifacts }}

  publish:
    name: 发布 ${{ needs.prep.outputs.channel }} (${{ needs.prep.outputs.version_name }})
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
          VER: ${{ needs.prep.outputs.version_name }}
          CH: ${{ needs.prep.outputs.channel }}
          CODE: ${{ needs.prep.outputs.version_code }}
          COUNT: ${{ needs.prep.outputs.count }}
          PRE: ${{ needs.prep.outputs.prerelease }}
          JRE: ${{ needs.prep.outputs.bundle_jre }}
          WEBUI_TAG: ${{ needs.prep.outputs.webui_tag }}
          WEBUI_KIND: ${{ needs.prep.outputs.webui_kind }}
        run: |
          # release 通道同版本重复发布：先删旧 tag/release
          if [ "$CH" = "release" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          case "$WEBUI_KIND" in
            stable) WEBUI_DESC="最新正式 release" ;;
            *)      WEBUI_DESC="最新构建（预发布）" ;;
          esac
          gh release create "$TAG" \
            artifacts/* \
            --title "Suwayomi $VER ($CH)" \
            --notes "## Suwayomi $VER · $CH
          - versionName: $VER
          - versionCode: $CODE
          - commits: $COUNT
          - channel: $CH（手动触发）
          - bundled WebUI: \`$WEBUI_TAG\`（$WEBUI_DESC）
          - prerelease: $PRE（beta 计作正式发布）
          - 命名：无后缀=基础包；Windows 勾选 JRE 时另有 \`+jre\`（捆绑 Temurin JRE 25，扩展沙盒自包含）。本次 jre=$JRE" \
            --prerelease="$PRE" \
            --generate-notes
