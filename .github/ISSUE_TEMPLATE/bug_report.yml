name: 🐞 Bug 报告
description: 报告可复现的缺陷：崩溃、报错、行为与文档不符
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜一遍[已有 issue](https://github.com/576576/Suwayomi-next/issues?q=is%3Aissue)。

        **扩展（图源）自身的问题不由本项目修复** —— 扩展由 keiyoushi 等仓库维护，请到对应仓库反馈。
        这里只处理「扩展加载 / 沙盒 / 与界面交互」这一层。

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始写，步骤要能让别人照着做出来。
      placeholder: |
        1. 打开 WebUI，进入……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 例如：应该正常打开该章节
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 报错原文请整段贴出，不要只写"报错了"。
      placeholder: 例如：页面空白，服务端日志里出现 panic / 500
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装形态
      description: 从哪个产物启动的
      options:
        - Windows 安装包（msi / setup.exe）
        - Windows 绿色版 zip
        - Linux tar.gz
        - macOS 包
        - Docker 镜像（GHCR）
        - Android APK
        - 从源码构建
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: 平台与架构
      description: 系统版本 + 产物里的架构段
      placeholder: 例如 Windows 11 24H2 / windows-x64（msvc）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本与通道
      description: 见 WebUI「设置 → 高级 → 调试信息」里的 Version 与 Channel
      placeholder: 例如 r3347-alpha 或 3.2.93
    validations:
      required: true

  - type: textarea
    id: debug-info
    attributes:
      label: 调试信息
      description: |
        WebUI「设置 → 高级 → 调试信息」→ 点「复制」→ 整段粘贴到下面（含版本、系统、数据库、扩展数等）。
      value: |
        <details>
        <summary>调试信息</summary>

        ```
        把复制到的内容粘到这里
        ```
        </details>
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        `<appdata>/logs/` 下有 `server` / `tray` / `sandbox` 三个日志；只贴出问题前后的一段即可。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      description: 逐条确认；缺项会被直接关闭。
      options:
        - label: 我已搜索过已有 issue，这不是重复问题。
          required: true
        - label: 我在**最新版本**上复现过；不是的话请先升级再试。
          required: true
        - label: 我已读过[使用文档](https://github.com/576576/Suwayomi-next/blob/main/docs/zh/user-guide.md)。
          required: true
        - label: 这不是某个扩展（图源）自身的问题。
          required: true
        - label: 标题简短且能区分问题（例如「下载完成后章节仍显示未读」）。
          required: true
