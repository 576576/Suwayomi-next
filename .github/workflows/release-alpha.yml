name: Auto build

# alpha 发布 CI：推送 main / dev 时自动构建 alpha，仅 Windows x64。
# 手动多通道/多架构发布走 release.yml（workflow_dispatch）。
#
# alpha 版本号（见 crates/suwayomi-server/build.rs）：
# - 内部 versionCode = commit count + 3000（46 次提交 -> 3046）
# - alpha versionName = r{versionCode}（46 -> r3046）；正式外部版本号
#   （3.x.y）由 release.yml 手动发布使用

on:
  push:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 alpha (windows-x64)
    runs-on: windows-latest
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
      count: ${{ steps.ver.outputs.count }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        name: 计算版本号
        shell: bash
        run: |
          COUNT="$(git rev-list --count HEAD)"
          VER_CODE="$((COUNT+3000))"
          VER_NAME="r${VER_CODE}"
          TAG="${VER_NAME}-alpha.${{ github.run_id }}"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "alpha build: $VER_NAME (code $VER_CODE, commits $COUNT) -> $TAG"
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: 构建
        # NB: 该步骤使用 bash 语法（行内 env 注入），Windows runner 上必须显式
        # 声明 shell: bash（否则默认 PowerShell 会把 VAR=val 当命令名解析报错）
        shell: bash
        run: |
          SUWAYOMI_VERSION_COUNT="${{ steps.ver.outputs.count }}" \
            cargo build --release -p suwayomi-server --target x86_64-pc-windows-msvc
      - name: 打包
        id: pack
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version_name }}"
          CH="alpha"
          TGT="windows-x64"
          BIN="target/x86_64-pc-windows-msvc/release/suwayomi-server.exe"

          # 产物命名：Suwayomi-r3046-windows-x64.zip（无 Next、无 -alpha 后缀）
          STAGE="dist/Suwayomi-${VER}-${TGT}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          # 桌面壳（Tauri 托盘+设置）
          cargo build --release --manifest-path tauri-app/Cargo.toml
          cp tauri-app/target/release/suwayomi-tray.exe "$STAGE/" 2>/dev/null || true

          # ---- 捆绑 WebUI（fork release 产物）+ 启动脚本 + data 目录 ----
          WEBUI_ZIP=$(curl -s "https://api.github.com/repos/576576/Suwayomi-WebUI/releases/latest" | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.zip')][0])")
          curl -sL -o webui.zip "$WEBUI_ZIP"
          mkdir -p "$STAGE/webui"
          python3 -c "import zipfile; zipfile.ZipFile('webui.zip').extractall('$STAGE/webui')"
          rm -f webui.zip
          cp suwayomi_launch.bat "$STAGE/" 2>/dev/null || true
          mkdir -p "$STAGE/data/autobackup" "$STAGE/data/downloads" "$STAGE/data/local"
          powershell -Command "Compress-Archive -Path 'dist/Suwayomi-${VER}-${TGT}' -DestinationPath 'dist/Suwayomi-${VER}-${TGT}.zip' -Force"
          echo "artifact=dist/Suwayomi-${VER}-${TGT}.zip" >> "$GITHUB_OUTPUT"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Suwayomi-${{ steps.ver.outputs.version_name }}-windows-x64
          path: ${{ steps.pack.outputs.artifact }}

  publish:
    name: 发布 alpha (${{ needs.build.outputs.version_name }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes 需要 git 仓库（读历史生成 changelog），
      # 而 publish job 无构建上下文——必须先 checkout（fetch-depth: 0 拿完整历史）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 alpha Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VER: ${{ needs.build.outputs.version_name }}
          CODE: ${{ needs.build.outputs.version_code }}
          COUNT: ${{ needs.build.outputs.count }}
        run: |
          gh release create "$TAG" \
            artifacts/* \
            --title "Suwayomi $VER (alpha)" \
            --notes "## Suwayomi $VER · alpha
          - versionName: $VER
          - versionCode: $CODE
          - commits: $COUNT
          - 构建: windows-x64（推送 main/dev 自动触发）" \
            --prerelease \
            --generate-notes
