name: Lint

# 质量门禁：格式 / 静态检查 / 测试。与 build.yml 分开——那边是 workflow_call 的
# 出包流水线（跑在发布与推送构建里），这边是每次 push / PR 都要过的门槛。
#
# 三道门：
#   fmt    —— `cargo fmt --all --check`，格式不一致直接失败（rustfmt.toml: edition 2024）
#   clippy —— `cargo clippy --workspace --all-targets -- -D warnings`
#             lint 级别由根 Cargo.toml 的 `[workspace.lints]` 统一定义，各 crate 继承。
#             存量已清零，所以这里可以 -D（含 unwrap_used / expect_used / panic，
#             测试代码通过各 crate 根部的 `#![cfg_attr(test, allow(...))]` 豁免）
#   test   —— `cargo test --workspace`；需要 PostgreSQL 的那批用例在没有
#             DATABASE_URL / SUWAYOMI_TEST_DB 时自己跳过，所以纯净 runner 也能跑
on:
  push:
    branches-ignore:
      - "gh-pages"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 检查格式
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test --workspace
