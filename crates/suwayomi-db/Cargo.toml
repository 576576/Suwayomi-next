[package]
name = "suwayomi-db"
description = "Dual-backend database layer: SQLite (rheos-tokio-rusqlite, default) or PostgreSQL (tokio-postgres)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde_json.workspace = true
futures.workspace = true

suwayomi-db-macros = { path = "../suwayomi-db-macros" }

# Default backend: SQLite on a dedicated OS thread (rusqlite 0.40 is pulled in
# by rheos; we depend on it directly to reach the raw `rusqlite` API inside
# `Connection::call`).
rheos-tokio-rusqlite = "2.0.1"
rusqlite = "0.40"

# Secondary backend: external PostgreSQL.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
# `ToSql::to_sql` writes into a `BytesMut`; also lets `PgParam` stay concrete.
bytes = "1"
