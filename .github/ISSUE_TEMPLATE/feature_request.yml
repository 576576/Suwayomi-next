name: ✨ 功能请求
description: 提出新增能力或对现有行为的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜一遍[已有 issue](https://github.com/576576/Suwayomi-next/issues?q=is%3Aissue)
        与 `docs/agent/plans/` 下的计划文档 —— 有些方向已经写明「不做」或有既定选型。

        **扩展（图源）相关的需求不由本项目实现**：扩展是 keiyoushi 等仓库的产物，
        请到对应仓库提；这里只处理扩展的加载与运行环境。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述现在的做法哪里别扭、代价是什么。先讲问题，不要直接给方案。
      placeholder: 例如：每换一次机器都要手工重配……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的形态
      description: 你希望看到的行为。有界面的话可以贴草图或参考实现的截图。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及哪一部分
      description: 可多选；拿不准就全选上
      multiple: true
      options:
        - WebUI 前端
        - 服务端（GraphQL / REST / OPDS）
        - 桌面壳（托盘 / 窗口）
        - 扩展运行时（沙盒）
        - 打包与分发
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你试过的绕法，或考虑过但觉得不合适的设计
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 我已搜索过已有 issue，这不是重复请求。
          required: true
        - label: 这不是某个扩展（图源）自身的功能请求。
          required: true
        - label: 我知道 WebUI 是独立发版的仓库，纯前端改动也可能被转到那边。
          required: false
