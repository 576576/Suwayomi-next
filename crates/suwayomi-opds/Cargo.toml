[package]
name = "suwayomi-opds"
description = "OPDS protocol (migrated from Suwayomi kotlin suwayomi/tachidesk/opds)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
suwayomi-core = { path = "../suwayomi-core" }
suwayomi-domain = { path = "../suwayomi-domain" }
# 只为拿 AppState 这个 axum state 类型，所以依赖的是 api 层而不是 rest 层。
suwayomi-api = { path = "../suwayomi-api" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
suwayomi-db.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
# 集成测试要注入桩源（`SourceBackend::Test`），它不在默认构建里。
suwayomi-domain = { path = "../suwayomi-domain", features = ["test-util"] }
# 桩源要 impl `SourceFetcher`，而那个 trait 是用 `async_trait` 声明的。
async-trait.workspace = true
