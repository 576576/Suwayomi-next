name: Bug 报告
description: 提交可复现的缺陷（崩溃、报错、行为与文档不符）
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先检索[既有 issue](https://github.com/576576/Suwayomi-next/issues?q=is%3Aissue)，
        并在最新版本上复现。

        扩展（图源）自身的问题不属于本项目范围，请向扩展所在仓库反馈。

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始逐步描述，使他人可以复现。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 期望行为与实际行为
      description: 分别说明预期结果与实际结果；报错请附完整原文。
      placeholder: |
        期望：
        实际：
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: 产物形态、操作系统、架构与版本号（版本号见 WebUI「设置 → 高级 → 调试信息」中的 Version）
      placeholder: 例：Windows 绿色版 zip / Windows 11 24H2 / x64 / r3347-alpha
    validations:
      required: true

  - type: textarea
    id: debug-info
    attributes:
      label: 调试信息
      description: 在 WebUI「设置 → 高级 → 调试信息」中复制后粘贴至下方。
      value: |
        <details>
        <summary>调试信息</summary>

        ```
        在此粘贴
        ```
        </details>
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 位于 `<appdata>/logs/`，server、tray、sandbox 各一份，附问题前后片段即可。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      description: 未满足以下事项的 issue 可能被直接关闭。
      options:
        - label: 已检索既有 issue，确认不是重复问题。
          required: true
        - label: 已在最新版本上复现，并已阅读使用文档。
          required: true
        - label: 该问题不是扩展（图源）自身导致。
          required: true
