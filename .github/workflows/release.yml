name: Release

# 发布 CI（唯一入口）：推送 main 出自动 alpha，手动 dispatch 出 alpha / beta / release。语义见 docs/agent/release.md。

on:
  push:
    branches: [main]
    # 纯文档改动不出包（paths-ignore 只在改动全部命中时才跳过）；本文件自身不在忽略范围。
    paths-ignore:
      - 'docs/**'
      # 两条都给：`**/` 能否匹配零级目录（根目录 README.md）在 glob 实现之间有歧义。
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道
        type: choice
        options: [alpha, beta, release]
        default: alpha
      # Windows 工具链：决定两个 Windows 目标用哪套 rust target —— msvc 走 VS 生成工具，
      # gnullvm 走 llvm-mingw（无 MSVC 依赖，产物静态链 CRT 与 libunwind）；all 是两套都出，
      # gnullvm 那份的产物名多一段 -gnullvm。放在平台开关之前，因为它管的是所有 Windows
      # 目标，不是某一个。
      windows_toolchain:
        description: Windows 工具链
        type: choice
        options: [msvc, gnullvm, all]
        default: msvc
      # 平台开关：先 Windows/Linux，再 Android，最后 macOS；同族内一律 x64 在前、arm64 在后。
      build_windows_x64:
        description: Windows x64
        type: boolean
        default: true
      build_windows_arm64:
        description: Windows arm64
        type: boolean
        default: false
      build_linux_x64:
        description: Linux x64
        type: boolean
        default: true
      build_linux_arm64:
        description: Linux arm64
        type: boolean
        default: false
      build_android_x64:
        description: Android x64
        type: boolean
        default: false
      build_android_arm64:
        description: Android arm64
        type: boolean
        default: false
      build_macos_x64:
        description: macOS x64
        type: boolean
        default: false
      build_macos_arm64:
        description: macOS arm64
        type: boolean
        default: false
      release_notes:
        description: 发行说明
        type: string
        default: ''
      pack_core:
        description: 产出核心包
        type: boolean
        default: false
      pack_jre:
        description: 产出 +jre 包
        type: boolean
        default: true
      pack_msi:
        description: 产出 msi 安装包（仅 Windows）
        type: boolean
        default: true
      pack_exe:
        description: 产出 exe 安装包（仅 Windows）
        type: boolean
        default: false
      pack_oci:
        description: 额外产出 OCI 包
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    name: 准备构建参数
    runs-on: ubuntu-latest
    permissions:
      # actions: write 供下面那段恒 401 的 run 标题 PATCH 用；contents: read 是 checkout 所需。
      actions: write
      contents: read
    outputs:
      channel: ${{ steps.out.outputs.channel }}
      channel_suffix: ${{ steps.out.outputs.channel_suffix }}
      pack_core: ${{ steps.out.outputs.pack_core }}
      targets: ${{ steps.out.outputs.targets }}
      android_targets: ${{ steps.out.outputs.android_targets }}
      version_name: ${{ steps.out.outputs.version_name }}
      version_code: ${{ steps.out.outputs.version_code }}
      count: ${{ steps.out.outputs.count }}
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
      pack_jre: ${{ steps.out.outputs.pack_jre }}
      pack_msi: ${{ steps.out.outputs.pack_msi }}
      pack_exe: ${{ steps.out.outputs.pack_exe }}
      pack_oci: ${{ steps.out.outputs.pack_oci }}
      # WebUI 制品在 prep 解析一次、所有 target 复用（避免各架构拉到不同构建）
      webui_url: ${{ steps.webui.outputs.url }}
      webui_tag: ${{ steps.webui.outputs.tag }}
      ext_runtime_url: ${{ steps.ext_runtime.outputs.url }}
      ext_runtime_version: ${{ steps.ext_runtime.outputs.version }}
      # 裁剪 JRE 按 <base>/ext-runtime-jre-<V>-<os>-<arch>.tar.gz 拼，不必逐个探测。
      ext_runtime_jre_base: ${{ steps.ext_runtime.outputs.jre_base }}
      # 托盘壳同理：解析一次，各 target 按 <base>/suwayomi-tray-<V>-<target>[.exe] 取。
      tray_version: ${{ steps.tray.outputs.version }}
      tray_base: ${{ steps.tray.outputs.base }}
      # 「捆绑组件」表里三行的版本号要能点进各自的 release 页面（仓库 slug 由解析步骤反推）。
      webui_release_url: ${{ steps.webui.outputs.release_url }}
      ext_runtime_release_url: ${{ steps.ext_runtime.outputs.release_url }}
      tray_release_url: ${{ steps.tray.outputs.release_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: out
        run: |
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            FLOW="manual"
            CHANNEL="${{ github.event.inputs.channel }}"
            WIN_TC="${{ github.event.inputs.windows_toolchain }}"
            PACK_CORE="${{ github.event.inputs.pack_core }}"
            PACK_JRE="${{ github.event.inputs.pack_jre }}"
            PACK_MSI="${{ github.event.inputs.pack_msi }}"
            PACK_EXE="${{ github.event.inputs.pack_exe }}"
            PACK_OCI="${{ github.event.inputs.pack_oci }}"
            ANDROID_ARM64="${{ github.event.inputs.build_android_arm64 }}"
            ANDROID_X64="${{ github.event.inputs.build_android_x64 }}"

            SEL=""
            [ "${{ github.event.inputs.build_windows_x64 }}" = "true" ] && SEL="$SEL windows-x64"
            [ "${{ github.event.inputs.build_windows_arm64 }}" = "true" ] && SEL="$SEL windows-arm64"
            [ "${{ github.event.inputs.build_linux_x64 }}" = "true" ] && SEL="$SEL linux-x64"
            [ "${{ github.event.inputs.build_linux_arm64 }}" = "true" ] && SEL="$SEL linux-arm64"
            [ "${{ github.event.inputs.build_macos_x64 }}" = "true" ] && SEL="$SEL macos-x64"
            [ "${{ github.event.inputs.build_macos_arm64 }}" = "true" ] && SEL="$SEL macos-arm64"

            # input 缺失时渲染成空串（不是 "false"），统一兜成 false。
            PACK_CORE="${PACK_CORE:-false}"
            PACK_JRE="${PACK_JRE:-false}"
            PACK_MSI="${PACK_MSI:-false}"
            PACK_EXE="${PACK_EXE:-false}"
            PACK_OCI="${PACK_OCI:-false}"
            ANDROID_ARM64="${ANDROID_ARM64:-false}"
            ANDROID_X64="${ANDROID_X64:-false}"
            WIN_TC="${WIN_TC:-msvc}"
          else
            # 推送 main：自动 alpha，固定 windows-x64 + linux-x64；形态与手动 dispatch 的默认值保持一致。
            FLOW="auto"
            CHANNEL="alpha"
            WIN_TC="msvc"
            PACK_CORE="false"
            PACK_JRE="true"
            PACK_MSI="true"
            PACK_EXE="false"
            PACK_OCI="false"
            ANDROID_ARM64="false"
            ANDROID_X64="false"
            SEL="windows-x64 linux-x64"
          fi

          # 通道段只有 beta 非空（beta 与 release 共用 3.y.z 版本名，不区分会重名）。
          if [ "$CHANNEL" = "beta" ]; then CH_SUFFIX="-beta"; else CH_SUFFIX=""; fi

          # 版本计数只能由提交历史推导（versionCode = 计数 + 3000），没有手填输入框。
          COUNT="$(git rev-list --count HEAD)"

          VER_CODE="$((COUNT+3000))"

          # alpha 用 r{code}；beta/release 用外部 3.y.z（规则见 docs/agent/release.md）
          if [ "$CHANNEL" = "alpha" ]; then
            VER_NAME="r${VER_CODE}"
          else
            VER_NAME="3.$((COUNT/100)).$(printf '%02d' $((COUNT%100)))"
          fi

          case "$CHANNEL" in
            release) TAG="v${VER_NAME}";                          PRE="false" ;;
            beta)    TAG="v${VER_NAME}-beta.${{ github.run_id }}"; PRE="false" ;;
            alpha)   TAG="${VER_NAME}-alpha.${{ github.run_id }}"; PRE="true" ;;
            *)       echo "::error::未知通道 $CHANNEL"; exit 1 ;;
          esac

          # 桌面/服务端矩阵；第 3、4 列是裁剪 JRE 资产的 (os, arch) 标签。macos-13 已下线，x64 用 macos-15-intel。
          # Windows 两行按 windows_toolchain 展开：msvc 用 target 原名，gnullvm 在 target 名后加
          # -gnullvm —— 产物名 / 附件名 / 桌面壳资产名都从 target 派生，所以这一维只加在这里。
          INCLUDE="$(python3 - "$SEL" "$WIN_TC" <<'PY'
          import json, sys

          tc = sys.argv[2]
          WIN = {
              "windows-x64":   ("windows-latest", "x86_64-pc-windows-",  "x64"),
              "windows-arm64": ("windows-11-arm", "aarch64-pc-windows-", "aarch64"),
          }
          mapping = {
              "linux-x64":   ("ubuntu-latest",    "x86_64-unknown-linux-gnu", "linux", "x64"),
              "linux-arm64": ("ubuntu-24.04-arm", "aarch64-unknown-linux-gnu","linux", "aarch64"),
              "macos-x64":   ("macos-15-intel",   "x86_64-apple-darwin",      "mac",   "x64"),
              "macos-arm64": ("macos-15",         "aarch64-apple-darwin",     "mac",   "aarch64"),
          }
          # all 是两套都出；顺序与「单独跑两次」一致（msvc 在前）。
          tcs = ("msvc", "gnullvm") if tc == "all" else (tc,)
          inc = []
          for t in sys.argv[1].split():
              if t in WIN:
                  os_name, triple, arch = WIN[t]
                  for one in tcs:
                      inc.append({"target": t if one == "msvc" else f"{t}-{one}",
                                  "os": os_name, "rust_target": f"{triple}{one}",
                                  "jre_os": "windows", "jre_arch": arch})
              elif t in mapping:
                  os_name, rt, jre_os, jre_arch = mapping[t]
                  inc.append({"target": t, "os": os_name, "rust_target": rt,
                              "jre_os": jre_os, "jre_arch": jre_arch})
          print(json.dumps(inc))
          PY
          )"

          # Android 矩阵：被勾上的架构各是一个 job（ABI 取值见 build-rust.sh）。
          ANDROID_INCLUDE="$(python3 - "$ANDROID_ARM64" "$ANDROID_X64" <<'PY'
          import json, sys
          # 顺序即 sys.argv 顺序，与上面的开关一一对应。
          mapping = [
              ("android-arm64", "arm64",  "aarch64-linux-android"),
              ("android-x64",   "x86_64", "x86_64-linux-android"),
          ]
          inc = [{"target": name, "abi": abi, "rust_target": rt}
                 for flag, (name, abi, rt) in zip(sys.argv[1:], mapping) if flag == "true"]
          print(json.dumps(inc))
          PY
          )"
          if [ -z "$SEL" ] && [ "$ANDROID_INCLUDE" = "[]" ] && [ "$PACK_OCI" != "true" ]; then
            echo "::error::未选择任何构建目标"
            exit 1
          fi
          # 工具链只有这三支。拼错的取值会凭空造出一个不存在的 rust target，那时每个 target
          # 都要白跑一遍编译才报错 —— 在这里拦下来。
          case "$WIN_TC" in
            msvc|gnullvm|all) ;;
            *) echo "::error::未知的 Windows 工具链：$WIN_TC"; exit 1 ;;
          esac
          # 两种安装包装的都是 +jre 那份内容（setup.exe 只是 msi 的 Burn 外壳），关掉 pack_jre 时无处可取。
          if [ "$PACK_MSI" = "true" ] || [ "$PACK_EXE" = "true" ]; then
            if [ "$PACK_JRE" != "true" ]; then
              echo "::error::pack_msi / pack_exe 需要同时打开 pack_jre（安装包装的是 +jre 那份）"
              exit 1
            fi
          fi
          # 选了桌面目标却两种包都关：每个 target 都会白跑一遍编译才报错，不如这里先拦。
          if [ -n "$SEL" ] && [ "$PACK_CORE" != "true" ] && [ "$PACK_JRE" != "true" ]; then
            echo "::error::选了桌面目标但 pack_core 与 pack_jre 都是关的，没有可发布的包"
            exit 1
          fi
          # 只勾 Android 时 SEL 为空、只勾 OCI 时两者都空，对应的矩阵 job 会跳过，合法。
          {
            echo "channel=$CHANNEL"
            echo "channel_suffix=$CH_SUFFIX"
            echo "pack_core=$PACK_CORE"
            echo "targets=$INCLUDE"
            echo "android_targets=$ANDROID_INCLUDE"
            echo "version_name=$VER_NAME"
            echo "version_code=$VER_CODE"
            echo "count=$COUNT"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
            echo "pack_jre=$PACK_JRE"
            echo "pack_msi=$PACK_MSI"
            echo "pack_exe=$PACK_EXE"
            echo "pack_oci=$PACK_OCI"
          } >> "$GITHUB_OUTPUT"
          echo "$FLOW 发布: $CHANNEL $VER_NAME (code $VER_CODE, commits $COUNT) -> $TAG"
          echo "   targets=[$SEL] android=[$ANDROID_ARM64 $ANDROID_X64] core=$PACK_CORE jre=$PACK_JRE msi=$PACK_MSI exe=$PACK_EXE oci=$PACK_OCI win_tc=$WIN_TC"

          # 未注入 GITHUB_TOKEN，此请求恒 401 被吞掉，run 标题一直是默认值（要生效补 env: GH_TOKEN）。
          if [ "$FLOW" = "manual" ]; then
            curl -s -X PATCH "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"name\":\"Release ${VER_NAME}\"}" >/dev/null 2>&1 || true
          fi

      - name: 解析捆绑的 WebUI 制品
        id: webui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手动 release 跟最新正式版；alpha/beta（含推送自动构建）跟最新构建
          case "${{ steps.out.outputs.channel }}" in
            release) KIND="stable" ;;
            *)       KIND="build"  ;;
          esac
          ZIP="$(bash scripts/resolve-webui.sh "$KIND")"
          TAG="${ZIP#*/download/}"
          TAG="${TAG%%/*}"
          # 发行说明里那行的版本号要跳到 release 页面：仓库 slug 从资产 URL 反推，别在这里另抄一份。
          REL="${ZIP%%/releases/download/*}/releases/tag/$TAG"
          echo "url=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$REL" >> "$GITHUB_OUTPUT"
          echo "捆绑 WebUI: $TAG（kind=$KIND）"

      - name: 解析扩展沙盒制品
        id: ext_runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ext-runtime 六个桌面 target 共用同一个 jar，解析一次即可；该仓推 main 会出 alpha 预发布，必须按通道挑。
          case "${{ steps.out.outputs.channel }}" in
            release) ER_KIND="--stable" ;;
            *)       ER_KIND="--build"  ;;
          esac
          OUT="$(bash scripts/resolve-ext-runtime.sh $ER_KIND)"
          URL="$(printf '%s' "$OUT" | sed -n 's/^url=//p')"
          VER="$(printf '%s' "$OUT" | sed -n 's/^version=//p')"
          BASE="$(printf '%s' "$OUT" | sed -n 's/^base=//p')"
          if [ -z "$URL" ] || [ -z "$VER" ] || [ -z "$BASE" ]; then
            echo "::error::无法解析 ext-runtime 制品"; exit 1
          fi
          # 发行说明里那行的版本号要跳到 release 页面：仓库 slug 从资产 URL 反推（与 WebUI 同一套路）。
          REPO_URL="${URL%%/releases/download/*}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jre_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "release_url=$REPO_URL/releases/tag/${BASE##*/}" >> "$GITHUB_OUTPUT"
          echo "捆绑 ext-runtime: $VER（$URL）"
          echo "裁剪 JRE 前缀: $BASE"

      - name: 解析桌面壳制品
        id: tray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 托盘壳六个 target 的资产在同一个 release 里，只解析版本与前缀；解析不到只告警（--optional）。
          case "${{ steps.out.outputs.channel }}" in
            release) TRAY_KIND="--stable" ;;
            *)       TRAY_KIND="--build"  ;;
          esac
          OUT="$(bash scripts/resolve-tray.sh --optional $TRAY_KIND)"
          URL="$(printf '%s' "$OUT" | sed -n 's/^url=//p')"
          VER="$(printf '%s' "$OUT" | sed -n 's/^version=//p')"
          BASE="$(printf '%s' "$OUT" | sed -n 's/^base=//p')"
          if [ -z "$VER" ] || [ -z "$BASE" ]; then
            echo "::warning::本次构建不含桌面壳（未解析到 Suwayomi-tray 资产）"
          else
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            # 没有桌面壳时发行说明里写「（本次未捆绑）」，所以这里的空值是有意义的，不能兜底。
            echo "release_url=${URL%%/releases/download/*}/releases/tag/${BASE##*/}" >> "$GITHUB_OUTPUT"
            echo "捆绑桌面壳: $VER（$BASE）"
          fi

  lint:
    name: 质量门禁（复用 lint.yml）
    # 与 prep 并行，不占发布链路的时间；门禁不过时由 build 的 needs 拦住编译。
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  build:
    name: 构建（复用 build.yml）
    needs: [prep, lint]
    # 被调工作流的权限不能超过调用方；OCI 要推 GHCR，所以这里必须给 packages: write。
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      channel: ${{ needs.prep.outputs.channel }}
      channel_suffix: ${{ needs.prep.outputs.channel_suffix }}
      pack_core: ${{ needs.prep.outputs.pack_core == 'true' }}
      version_name: ${{ needs.prep.outputs.version_name }}
      count: ${{ needs.prep.outputs.count }}
      webui_url: ${{ needs.prep.outputs.webui_url }}
      ext_runtime_url: ${{ needs.prep.outputs.ext_runtime_url }}
      ext_runtime_version: ${{ needs.prep.outputs.ext_runtime_version }}
      ext_runtime_jre_base: ${{ needs.prep.outputs.ext_runtime_jre_base }}
      tray_version: ${{ needs.prep.outputs.tray_version }}
      tray_base: ${{ needs.prep.outputs.tray_base }}
      targets: ${{ needs.prep.outputs.targets }}
      android_targets: ${{ needs.prep.outputs.android_targets }}
      pack_jre: ${{ needs.prep.outputs.pack_jre == 'true' }}
      pack_msi: ${{ needs.prep.outputs.pack_msi == 'true' }}
      pack_exe: ${{ needs.prep.outputs.pack_exe == 'true' }}
      pack_oci: ${{ needs.prep.outputs.pack_oci == 'true' }}
    # 必须显式继承：被调工作流默认拿不到调用方 secret，漏了会静默回退 debug key 签名。
    secrets: inherit

  publish:
    name: 发布 ${{ needs.prep.outputs.channel }} (${{ needs.prep.outputs.version_name }})
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
        # 只勾 OCI 时没有任何附件，下载步骤会报 "no artifacts found"，允许为空。
        continue-on-error: true
      - name: 收到的构建产物
        run: |
          mkdir -p artifacts
          ls -la artifacts
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
          VER: ${{ needs.prep.outputs.version_name }}
          CH: ${{ needs.prep.outputs.channel }}
          CH_SUFFIX: ${{ needs.prep.outputs.channel_suffix }}
          PRE: ${{ needs.prep.outputs.prerelease }}
          WEBUI_TAG: ${{ needs.prep.outputs.webui_tag }}
          # 「捆绑组件」表要用：三个仓库集成的版本在产物名里都看不到，版本号再各带一个 release 页面链接。
          EXT_RUNTIME_VERSION: ${{ needs.prep.outputs.ext_runtime_version }}
          TRAY_VERSION: ${{ needs.prep.outputs.tray_version }}
          WEBUI_REL: ${{ needs.prep.outputs.webui_release_url }}
          EXT_REL: ${{ needs.prep.outputs.ext_runtime_release_url }}
          TRAY_REL: ${{ needs.prep.outputs.tray_release_url }}
          # OCI 不进附件，只在下载表的 Linux 格里挂一枚徽章，靠它判断该不该出现。
          PACK_OCI: ${{ needs.prep.outputs.pack_oci }}
          # 手动触发时维护者填的发行说明（推送自动构建没有这个输入，恒为空）
          NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          # release 通道同版本重复发布：先删旧 tag/release（alpha/beta 的 tag 天然唯一，不删）
          if [ "$CH" = "release" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          # 附件只按正向白名单收 Suwayomi-*，且不能写成裸 artifacts/*（空目录时 glob 不展开）。
          FILES=()
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              Suwayomi-*) FILES+=("$f") ;;
              *) echo "跳过非发布产物：$f" ;;
            esac
          done

          # 三个捆绑仓库的版本号在产物 zip 里都看不到，单列一张表；版本号点进各自的 release 页面。
          link() {   # <版本> <release 页面>：页面缺失时退化成纯等宽版本号
            if [ -n "$2" ]; then printf '[%s](%s)' "\`$1\`" "$2"; else printf '%s' "\`$1\`"; fi
          }
          WEBUI_CELL="$(link "$WEBUI_TAG" "$WEBUI_REL")"
          EXT_CELL="$(link "$EXT_RUNTIME_VERSION" "$EXT_REL")"
          # 托盘壳缺失时如实标注，这一格没有版本号也就没有链接。
          TRAY_CELL="（本次未捆绑）"
          [ -z "$TRAY_VERSION" ] || TRAY_CELL="$(link "$TRAY_VERSION" "$TRAY_REL")"
          BUNDLED_TABLE="| 捆绑组件 | 集成的版本 |
          |---|---|
          | Suwayomi-WebUI | $WEBUI_CELL |
          | Suwayomi-ext-runtime | $EXT_CELL |
          | Suwayomi-tray | $TRAY_CELL |"

          # 下载架构表（同 FlClash 的「Download based on your OS」）：只按实际收到的附件渲染，徽章直达下载地址。
          REL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          BADGE_HOST="https://img.shields.io/badge"   # 表格里每个格子都走 shields.io，提出来免得下面几行太长
          # simple-icons 因商标下架了 windows 图标（logo=windows 静默失效），只能自绘内嵌（四格非倾斜 = Win11 形状）；base64 里的 + 要写 %2B。
          # viewBox 留出 4 单位内边距：四格是实心块，满幅（0..24）在 14px 下比其他图标显大，收到 75%。
          WIN_LOGO="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9Ii00IC00IDMyIDMyIiBmaWxsPSIjZmZmIj48cGF0aCBkPSJNMCAwaDExLjM3N3YxMS4zNzJIMHptMTIuNjIzIDBIMjR2MTEuMzcySDEyLjYyM3pNMCAxMi42MjNoMTEuMzc3VjI0SDB6bTEyLjYyMyAwSDI0VjI0SDEyLjYyM3oiLz48L3N2Zz4="
          badge() {   # <形态> <架构> <底色> <图标> <文件名>
            printf '<a href="%s/%s"><img src="%s/%s-%s-%s.svg?logo=%s" alt="%s"></a><br>' \
              "$REL_URL" "$5" "$BADGE_HOST" "$1" "$2" "$3" "$4" "$5"
          }
          # 按「<平台>-<架构>[-gnullvm][_<形态>]」收进表再按固定顺序取：附件的字典序会把 +jre 排到
          # 基线包前、arm64 排到 x64 前。工具链段只带在 gnullvm 那份上（msvc 是默认、产物名保持
          # 原样），它既进键也进徽章左半边的文字（「ZIP GNULLVM」），与 msvc 那份各占一格。
          declare -A DL_BADGE=()
          for f in "${FILES[@]}"; do
            n="$(basename "$f")"
            REST="${n#Suwayomi-${VER}${CH_SUFFIX}-}"
            case "$REST" in
              android-arm64.apk) DL_BADGE[android-arm64]="$(badge APK arm64 168039 android "$n")"; continue ;;
              android-x64.apk)   DL_BADGE[android-x64]="$(badge APK x64 168039 android "$n")"; continue ;;
            esac
            FACE=""
            case "$REST" in
              *.zip)       STEM="${REST%.zip}";       LABEL="ZIP" ;;
              *.tar.gz)    STEM="${REST%.tar.gz}";    LABEL="tar.gz" ;;
              *.msi)       STEM="${REST%.msi}";       LABEL="MSI" ;;
              # 「EXE」单看太含糊（zip 里也有 exe），徽章上写全「Installer EXE」。
              *-setup.exe) STEM="${REST%-setup.exe}"; LABEL="EXE"; FACE="Installer_EXE" ;;
              *) echo "跳过未识别的产物：$n"; continue ;;
            esac
            # 同一架构的基线包与 +jre 包共处一格：键里留 _JRE 区分，徽章右半边写「+JRE」（%2B 才是字面加号）。
            JRE_KEY=""; JRE_FACE=""
            case "$STEM" in *+jre) STEM="${STEM%+jre}"; JRE_KEY="_JRE"; JRE_FACE="_%2BJRE" ;; esac
            # 工具链段要**在 +jre 之后**摘：它贴在架构后面，而 +jre 贴在最后，先摘工具链摘不掉
            # （`*-gnullvm` 匹配不到以 `+jre` 结尾的名字），留下来就会挡住下面的平台段解析。
            VAR=""; VAR_FACE=""
            case "$STEM" in *-gnullvm) STEM="${STEM%-gnullvm}"; VAR="-gnullvm"; VAR_FACE="_GNULLVM" ;; esac
            FACE="${FACE:-$LABEL}$VAR_FACE"
            # 安装包（msi / setup.exe）与便携包分区：键尾带 _MSI / _EXE，渲染时排在同架构的 zip 前。
            KIND=""
            case "$LABEL" in MSI|EXE) KIND="_$LABEL" ;; esac
            case "${STEM%-*}" in
              windows) COLOR="2d7d9a"; ICON="$WIN_LOGO" ;;
              linux)   COLOR="f84e29"; ICON="linux" ;;
              macos)   COLOR="333333"; ICON="apple" ;;
              *) echo "跳过未知平台：$n"; continue ;;
            esac
            # 安装包与便携包同族不同色（靛蓝 vs 青蓝），一眼能看出这两枚是装上去的。
            [ -z "$KIND" ] || COLOR="4a4e8f"
            DL_BADGE["${STEM%-*}-${STEM##*-}$VAR$KIND$JRE_KEY"]="$(badge "$FACE" "${STEM##*-}$JRE_FACE" "$COLOR" "$ICON" "$n")"
          done
          # OCI 只推 GHCR、不进 Release 附件，所以单独做枚徽章垫在 Linux 格末尾，点进去是包页面。
          if [ "$PACK_OCI" = "true" ]; then
            OCI_TAG="${VER}${CH_SUFFIX}"
            OCI_REF="ghcr.io/${GITHUB_REPOSITORY,,}:${OCI_TAG}"
            DL_BADGE[linux-oci]="$(printf '<a href="%s/pkgs/container/%s"><img src="%s/OCI-%s-2496ed.svg?logo=docker" alt="%s"></a><br>' \
              "https://github.com/${GITHUB_REPOSITORY}" "${GITHUB_REPOSITORY##*/}" "$BADGE_HOST" "$OCI_TAG" "$OCI_REF")"
          fi
          dl_cell() {   # <平台> <显示名>：每个架构「安装包 → 基线包 → +jre」，Linux 格末尾垫 OCI
            local p="$1" name="$2" arch var suf k cell="" oci="$1-oci"
            for arch in x64 arm64; do
              # 工具链维度排在架构之内：先 msvc（产物名不带段）再 gnullvm。
              for var in "" "-gnullvm"; do
                for suf in _MSI _EXE "" _JRE; do
                  k="$p-$arch$var$suf"
                  [ -n "${DL_BADGE[$k]:-}" ] || continue
                  cell="$cell${DL_BADGE[$k]}"$'\n'
                done
              done
            done
            [ -z "${DL_BADGE[$oci]:-}" ] || cell="$cell${DL_BADGE[$oci]}"$'\n'
            [ -n "$cell" ] || return 0
            printf '<tr><td>%s</td><td>\n%s</td></tr>\n' "$name" "$cell"
          }
          # 行序固定：Windows → Linux → Android → macOS；格内先 x64 再 arm64，各架构内安装包垫在 zip 前。
          DL_ROWS="$(dl_cell windows Windows)$(dl_cell linux Linux)$(dl_cell android Android)$(dl_cell macos macOS)"
          DOWNLOAD_TABLE=""
          if [ -n "$DL_ROWS" ]; then
            DOWNLOAD_TABLE="**Download based on your OS:**

          <table>
              <thead align=left>
                  <tr>
                      <th>OS</th>
                      <th>Download</th>
                  </tr>
              </thead>
              <tbody align=left>
          ${DL_ROWS}    </tbody>
          </table>"
          fi

          # 签名政策：SignPath 的条款要求下载 / release 页上出现这一段（标题或链接文字用
          # "Code signing policy"），所以每个 release 都带，与产物本身是否已签名无关。
          SIGNING_NOTE="**Code signing policy** — Windows 安装包由 [SignPath.io](https://signpath.io/) 免费签名，证书由 [SignPath Foundation](https://signpath.org/) 签发。详见 [Code signing policy](https://github.com/${GITHUB_REPOSITORY}/blob/main/CODE_SIGNING_POLICY.md) 与 [PRIVACY.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/PRIVACY.md)。"

          # 说明顺序：手填说明 → 捆绑组件表 → 下载架构表 → 签名政策；changelog 由 --generate-notes 追加在最后。
          BODY="$BUNDLED_TABLE"
          if [ -n "$DOWNLOAD_TABLE" ]; then
            # 两个换行：markdown 表格与紧随的段落之间必须留空行，否则表被当成延续行。
            BODY="$BODY"$'\n\n'"$DOWNLOAD_TABLE"
          fi
          BODY="$BODY"$'\n\n'"$SIGNING_NOTE"
          # UI 是单行框，字面量 \n 在这里还原；粘贴进来的 \r 直接去掉。
          NOTES="${NOTES//$'\r'/}"
          if [ -n "$NOTES" ]; then
            BODY="$(printf '%b' "$NOTES")"$'\n\n'"$BODY"
          fi

          # 自动与手动共用一套渲染：自动通道恒为 alpha，标题与 heading 正好与手动同形。
          gh release create "$TAG" "${FILES[@]}" \
            --title "Suwayomi $VER ($CH)" \
            --notes "## Suwayomi $VER · $CH
          $BODY" \
            --prerelease="$PRE" \
            --generate-notes
